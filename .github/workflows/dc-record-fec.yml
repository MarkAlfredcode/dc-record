name: DC Record • Campaigns & Congress

on:
  # `schedule:` DISABLED 2026-09-12 -- GitHub's own schedule event was
  # observed firing this and the other 3 editions ~3.5h late every single
  # day (best-effort, no SLA). Replaced by ../scheduler/, a Cloudflare
  # Worker with its own Cron Triggers that calls workflow_dispatch below at
  # the exact times these crons used to (0 10 * * * / 45 22 * * * UTC).
  # Left here, commented, so the intended times/rationale aren't lost.
  # schedule:
  #   - cron: '0 10 * * *'    # AM, ~3:00am PT (PDT) -- dispatched with mode:"am"
  #   - cron: '45 22 * * *'   # PM, ~3:45pm PT (PDT) -- dispatched with mode:"pm"
  #                           # See ../scheduler/README.md.
  workflow_dispatch:
    inputs:
      mode:
        description: 'Which subscriber group to email: am or pm (see markalfred.news/dc-record-recipients). 2026-09-16: PM used to be a hardcoded no-email site-refresh; now it really sends, but only to subscribers who opted into the PM edition -- if nobody has, it still quietly no-ops (email_skipped.flag), same visible effect as before.'
        required: false
        default: 'am'
      test_recipient_override:
        description: 'Send only to this address instead of the live subscriber list (leave blank for normal recipients)'
        required: false
        default: ''
      skip_email:
        description: 'Skip sending email entirely (true/false) -- manual override for snapshot-only test runs (e.g. producing an AM/PM edition to look at). The scheduler no longer sets this for the PM slot -- see mode above.'
        required: false
        default: 'false'
      verbose_diagnostics:
        description: 'Capture a full tool-by-tool trace (stream-json) as a build artifact, for cost/turn debugging (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write  # needed to commit the incumbent-candidates manifest (Task 1) and the fec-filings-seen/pfd-ptr-seen dedupe manifests (Tasks 1 & 2)

concurrency:
  group: dc-record-fec
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/claude" --version
          python3 --version

      - name: Compute today's date
        id: date
        run: echo "today=$(TZ=America/Los_Angeles date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # Just the MANUAL override signal now -- not the full "will this run
      # send" answer, since that also depends on live subscriber counts,
      # which aren't known until the Send email step actually queries them.
      # The Commit step below derives its own answer from whether that step
      # actually wrote email_sent.flag, not from this.
      - name: Determine manual skip override
        id: email_decision
        run: |
          MANUAL_SKIP="false"
          if [ "${{ github.event.inputs.skip_email }}" == "true" ]; then
            MANUAL_SKIP="true"
          fi
          echo "manual_skip=$MANUAL_SKIP" >> "$GITHUB_OUTPUT"

      # 2026-09-14: the two newest tasks (Voided & Negative Transactions,
      # the red-flag keyword scan) get the full fetch-script treatment from
      # day one instead of running inside Claude's own turn -- same pattern
      # as the Executive Branch edition's fetch_omb.py/fetch_oge.py. The
      # rest of this edition (Task 1's RFAI/F99 letters, Task 2's PFD/PTR)
      # still does its own fetching/dedup/PDF-reading via Bash as before
      # (see /Users/mark/.claude/plans/imperative-brewing-lerdorf.md for why
      # that migration is a separate future phase, not this one). Both
      # scripts are allowed to fail without failing the job -- the main
      # pass's prompt has a fallback path for a missing/broken
      # content-mechanical.json (see prompt-fec.txt's ARCHITECTURE note).
      - name: Run negative-amounts and keyword-scan fetch scripts
        env:
          FEC_KEYS: ${{ secrets.FEC_KEYS }}
        run: |
          set +e
          python3 scripts/fetch_negative_amounts.py; echo "fetch_negative_amounts exit=$?"
          python3 scripts/fetch_keyword_scan.py; echo "fetch_keyword_scan exit=$?"
          set -e

      - name: Run mechanical content pass (Voided & Negative Transactions + keyword-scan handoff, cheap model)
        id: run_mechanical
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set +e
          cat prompt-fec-mechanical.txt | \
            claude -p \
              --model claude-haiku-4-5-20251001 \
              --permission-mode bypassPermissions \
              --allowedTools "Read,Write" \
              --output-format json > claude_mechanical_result.json
          echo "mechanical exit=$?"
          set -e

          echo "::group::Claude usage/cost (mechanical pass)"
          if jq -e . claude_mechanical_result.json >/dev/null 2>&1; then
            jq -r '"cost_usd=" + (.total_cost_usd|tostring) + "  input_tokens=" + (.usage.input_tokens|tostring) + "  output_tokens=" + (.usage.output_tokens|tostring) + "  cache_read_input_tokens=" + (.usage.cache_read_input_tokens|tostring) + "  num_turns=" + (.num_turns|tostring)' claude_mechanical_result.json
          else
            echo "No valid JSON result -- main pass will use its fallback path. Raw output:"
            cat claude_mechanical_result.json
          fi
          echo "::endgroup::"

          echo "::group::Claude final message (mechanical pass)"
          jq -r '.result // empty' claude_mechanical_result.json 2>/dev/null || true
          echo "::endgroup::"
          exit 0

      # 2026-09-12 architecture change: Claude no longer writes the final
      # HTML or sends the email itself -- it writes content-TODAY.json (see
      # prompt-fec.txt's OUTPUT FORMAT section) and scripts/render_fec.py +
      # scripts/send_email.py below take it from there.
      - name: Run DC Record • Campaigns & Congress (content generation)
        id: run_edition
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          FEC_KEYS: ${{ secrets.FEC_KEYS }}
        run: |
          set +e
          if [ "${{ github.event.inputs.verbose_diagnostics }}" == "true" ]; then
            # stream-json emits one JSON object per turn/tool-call instead of
            # only the final result, so a turn-by-turn breakdown can actually
            # be reconstructed afterward -- plain --output-format json (the
            # normal path below) throws that away, which is why the 2026-09-11
            # PM-test cost spike couldn't be diagnosed from its log alone. The
            # stream's last line is a "result" event, same shape as plain
            # json's single object, so the existing cost/turn extraction below
            # still works unmodified against it.
            cat prompt-fec.txt | \
              claude -p \
                --permission-mode bypassPermissions \
                --allowedTools "Bash,Read,Write,Edit,Glob,Grep" \
                --output-format stream-json --verbose > claude_stream.jsonl
            CLAUDE_EXIT=$?
            tail -n1 claude_stream.jsonl > claude_result.json
          else
            cat prompt-fec.txt | \
              claude -p \
                --permission-mode bypassPermissions \
                --allowedTools "Bash,Read,Write,Edit,Glob,Grep" \
                --output-format json > claude_result.json
            CLAUDE_EXIT=$?
          fi
          set -e

          echo "::group::Claude usage/cost (Campaigns & Congress)"
          if jq -e . claude_result.json >/dev/null 2>&1; then
            jq -r '"cost_usd=" + (.total_cost_usd|tostring) + "  input_tokens=" + (.usage.input_tokens|tostring) + "  output_tokens=" + (.usage.output_tokens|tostring) + "  cache_creation_input_tokens=" + (.usage.cache_creation_input_tokens|tostring) + "  cache_read_input_tokens=" + (.usage.cache_read_input_tokens|tostring) + "  duration_ms=" + (.duration_ms|tostring) + "  num_turns=" + (.num_turns|tostring)' claude_result.json
          else
            echo "No valid JSON result (likely errored before completion, e.g. a session-limit preflight failure). Raw output:"
            cat claude_result.json
          fi
          echo "::endgroup::"

          echo "::group::Claude final message (Campaigns & Congress)"
          jq -r '.result // empty' claude_result.json 2>/dev/null || true
          echo "::endgroup::"

          exit $CLAUDE_EXIT

      - name: Upload verbose diagnostics trace
        if: always() && github.event.inputs.verbose_diagnostics == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: claude-stream-trace-${{ github.run_id }}
          path: claude_stream.jsonl
          if-no-files-found: ignore
          retention-days: 7

      - name: Render newsletter from content JSON
        if: hashFiles(format('content-{0}.json', steps.date.outputs.today)) != ''
        run: |
          python3 scripts/render_fec.py "content-${{ steps.date.outputs.today }}.json" "newsletter-${{ steps.date.outputs.today }}.html"

      - name: Send email
        if: hashFiles(format('newsletter-{0}.html', steps.date.outputs.today)) != ''
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DC_RECORD_RECIPIENTS_TOKEN: ${{ secrets.DC_RECORD_RECIPIENTS_TOKEN }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then MODE="am"; fi
          if [ "${{ steps.email_decision.outputs.manual_skip }}" == "true" ]; then
            echo "manual skip_email input -- not sending" > email_skipped.flag
          elif [ -n "${{ github.event.inputs.test_recipient_override }}" ]; then
            python3 scripts/send_email.py \
              "newsletter-${{ steps.date.outputs.today }}.html" \
              "DC Record • Campaigns & Congress • ${{ steps.date.outputs.today }}" \
              --from "DC Record • Campaigns & Congress <newsletter@markalfred.news>" \
              --to "${{ github.event.inputs.test_recipient_override }}"
          else
            EMAILS=$(curl -s -H "Authorization: Bearer $DC_RECORD_RECIPIENTS_TOKEN" \
              "https://markalfred.news/dc-record-recipients?edition=campaigns&mode=$MODE" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print(','.join(d.get('emails', [])))")
            if [ -z "$EMAILS" ]; then
              echo "no subscribers for campaigns/$MODE -- not sending" > email_skipped.flag
            else
              python3 scripts/send_email.py \
                "newsletter-${{ steps.date.outputs.today }}.html" \
                "DC Record • Campaigns & Congress • ${{ steps.date.outputs.today }}" \
                --from "DC Record • Campaigns & Congress <newsletter@markalfred.news>" \
                --to "$EMAILS"
            fi
          fi

      - name: Push ntfy notification of this run's outcome
        if: always()
        run: |
          notify() {
            curl -s --max-time 10 -H "Title: $1" -H "Tags: $2" -d "$3" \
              https://ntfy.sh/markalfreddotnews >/dev/null 2>&1 || true
          }
          if [ -f email_sent.flag ]; then
            notify "DC Record Campaigns & Congress sent" "email" "$(cat email_sent.flag)"
          elif [ -f email_skipped.flag ]; then
            # email_skipped.flag now also covers "mode had zero subscribers",
            # not just manual test runs -- see the Send email step above.
            notify "DC Record Campaigns & Congress: test run (no email)" "test_tube" "$(cat email_skipped.flag)"
          elif [ -f email_failed.flag ]; then
            notify "DC Record Campaigns & Congress FAILED" "rotating_light" "$(cat email_failed.flag)"
          elif [ -f content_skipped.flag ]; then
            notify "DC Record Campaigns & Congress skipped" "warning" "$(cat content_skipped.flag)"
          elif [ -f content_failed.flag ]; then
            notify "DC Record Campaigns & Congress content FAILED" "rotating_light" "$(cat content_failed.flag)"
          elif [ "${{ steps.run_edition.outcome }}" == "failure" ]; then
            notify "DC Record Campaigns & Congress CRASHED" "rotating_light" "Run step failed with no status flag written — check the Actions log."
          else
            notify "DC Record Campaigns & Congress: unknown outcome" "warning" "Run finished but wrote no status flag — check the Actions log."
          fi

      # Also mirrors today's newsletter to a fixed repo path (digest/campaigns.html)
      # so the DC Record Digest routine can read it straight from its own git
      # checkout -- GitHub Actions' build-artifact download redirects to Azure
      # Blob Storage, which that routine's cloud sandbox cannot reach (confirmed
      # live 2026-09-05), so a committed file is the reliable path.
      - name: Commit updated manifests and today's newsletter
        run: |
          set -euo pipefail
          # Derived from the actual send outcome, not from mode/manual_skip
          # directly -- since 2026-09-16 a "pm" mode run can genuinely send
          # (to PM subscribers) just like "am" does, so the old shortcut of
          # treating "pm" as always-a-site-refresh no longer holds. What
          # matters for the manifest/digest-advance decision below is simply
          # whether an email actually went out this run, regardless of mode.
          IS_SITE_REFRESH="true"
          if [ -f email_sent.flag ]; then
            IS_SITE_REFRESH="false"
          fi
          mkdir -p digest
          if compgen -G "newsletter-*.html" > /dev/null; then
            # AM/PM edition snapshots: the first run of the Pacific calendar
            # day becomes the AM edition; if a run already happened today, a
            # later run becomes the PM edition instead of silently
            # overwriting the morning's snapshot. digest/campaigns.html
            # stays a "latest" alias for backward compatibility with
            # anything reading that fixed path -- but a site-refresh-only
            # (no-email) run never advances it, so the site's default view
            # stays on the real AM edition instead of today's unsent scrape;
            # that scrape is still saved to digest/campaigns-pm.html,
            # reachable via the PM Edition dropdown for anyone who wants it.
            TODAY_TAG=$(TZ="America/Los_Angeles" date +%Y-%m-%d)
            AM_DATE_FILE="digest/.campaigns-am-date"
            PREV_AM_DATE=$(cat "$AM_DATE_FILE" 2>/dev/null || echo "")
            if [ "$PREV_AM_DATE" != "$TODAY_TAG" ]; then
              cp newsletter-*.html digest/campaigns-am.html
              echo "$TODAY_TAG" > "$AM_DATE_FILE"
              rm -f digest/campaigns-pm.html
            else
              cp newsletter-*.html digest/campaigns-pm.html
            fi
            if [ "$IS_SITE_REFRESH" == "true" ]; then
              echo "Site-refresh-only (no-email) run -- leaving digest/campaigns.html on the real AM edition."
            else
              cp newsletter-*.html digest/campaigns.html
            fi
          else
            echo "No newsletter file produced this run (likely a skipped/failed run) -- leaving digest/campaigns*.html as-is."
          fi
          # A site-refresh-only run still lets Claude update the FEC-
          # filings/PFD-PTR dedupe manifests on disk as part of its normal
          # task instructions -- revert those specific files before staging
          # so nothing gets marked "seen" without ever having been emailed;
          # tomorrow's real 3:00am run will naturally re-find and correctly
          # email whatever this run scraped first. incumbent-candidates-
          # manifest.json isn't a "seen" dedupe file (just a candidate-
          # status cache), so it's fine to let it update normally either way.
          if [ "$IS_SITE_REFRESH" == "true" ]; then
            git checkout -- data/fec-filings-seen.json data/pfd-ptr-seen.json data/negative-amounts-seen.json 2>/dev/null || true
          fi
          # `git add` before the diff check, and check --cached rather than
          # the working-tree diff -- a brand-new untracked file (e.g. the
          # first-ever digest/campaigns-pm.html) is invisible to a plain
          # `git diff`, which would silently skip the commit entirely
          # (confirmed live 2026-09-12).
          git add data/incumbent-candidates-manifest.json data/fec-filings-seen.json data/pfd-ptr-seen.json data/negative-amounts-seen.json digest/
          if ! git diff --cached --quiet; then
            git config user.name "dc-record-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "Update incumbent-candidates/FEC-filings/PFD-PTR/negative-amounts manifests and today's newsletter [skip ci]"
            # Executive Branch's manifest-commit step runs on the same cron
            # slot and can push to this same branch around the same time --
            # rebase-and-retry on a non-fast-forward push instead of failing
            # outright (confirmed happening live 2026-09-05).
            PUSHED=false
            for i in 1 2 3 4 5; do
              if git push; then
                PUSHED=true
                break
              fi
              echo "Push rejected (attempt $i/5), rebasing onto latest and retrying..."
              git pull --rebase
              sleep $((RANDOM % 5 + 1))
            done
            $PUSHED
          else
            echo "Manifest and newsletter unchanged, nothing to commit."
          fi

      - name: Upload generated newsletter as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-fec-${{ github.run_id }}
          path: newsletter-*.html
          if-no-files-found: ignore
          retention-days: 30
