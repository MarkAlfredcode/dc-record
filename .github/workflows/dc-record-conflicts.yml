name: DC Record • Conflicts

on:
  # Dispatched by ../scheduler/ (Cloudflare Worker) with the other editions,
  # at 0 14 / 45 22 UTC. Web-only, never emailed, and no Claude pass at all:
  # every section comes from deterministic scanners (scripts/build_conflicts.py).
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dc-record-conflicts
  cancel-in-progress: false

jobs:
  # Duplicate-dispatch guard (added 2026-10-10). Cloudflare has been firing
  # each cron twice, and this edition doesn't email, so it has no data/sent/
  # line to check like the emailing editions' guard. Instead: skip if another
  # dispatch of this same workflow was created in the 10 minutes before this
  # one. Fails open (runs anyway) if the API can't be asked. A manual rerun
  # within 10 minutes of a real one is skipped too -- wait it out.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Check whether this slot was already dispatched
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          SKIP=false
          if ME=$(gh api "repos/$REPO/actions/runs/$RUN_ID"); then
            WF=$(jq -r .workflow_id <<<"$ME")
            CREATED=$(jq -r .created_at <<<"$ME")
            SINCE=$(date -u -d "@$(( $(date -u -d "$CREATED" +%s) - 600 ))" +%Y-%m-%dT%H:%M:%SZ)
            EARLIER=$(gh api "repos/$REPO/actions/workflows/$WF/runs?event=workflow_dispatch&per_page=20&created=$SINCE..$CREATED" \
              --jq "[.workflow_runs[] | select(.id < $RUN_ID)] | length" || echo 0)
            if [ "${EARLIER:-0}" -gt 0 ]; then
              SKIP=true
              echo "::notice::another dispatch of this workflow was created between $SINCE and $CREATED -- skipping this duplicate."
            fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

  publish:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python3 -m pip install --quiet requests
          python3 --version

      - name: Compute today's date
        id: date
        run: echo "today=$(TZ=America/Los_Angeles date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # fetch_donor_awards.py's "new awards" half reads
      # data/usaspending_candidates.json (gitignored, normally written by the
      # Feds run). Rebuild it here, then put the committed manifest back so
      # this run never marks an award as seen on the Feds edition's behalf.
      - name: Pull current USAspending awards (candidates only)
        run: |
          set +e
          timeout 900 python3 scripts/fetch_usaspending.py; echo "fetch_usaspending exit=$?"
          git checkout -- data/usaspending-contracts-manifest.json 2>/dev/null || true
          set -e

      - name: Run conflict scanners
        env:
          FEC_KEYS: ${{ secrets.FEC_KEYS }}
        run: |
          if [ "$(date -u +%H)" -lt 18 ]; then export MODE=am; else export MODE=pm; fi
          set +e
          for s in fetch_donor_awards.py fetch_pfd_analysis.py; do
            timeout 1500 python3 scripts/$s; echo "$s exit=$?"
          done
          set -e

      - name: Build and render page
        run: |
          if [ "$(date -u +%H)" -lt 18 ]; then export MODE=am; else export MODE=pm; fi
          python3 scripts/build_conflicts.py "content-${{ steps.date.outputs.today }}.json"
          python3 scripts/render_conflicts.py "content-${{ steps.date.outputs.today }}.json" "newsletter-${{ steps.date.outputs.today }}.html"

      - name: Push ntfy notification of this run's outcome
        if: always()
        run: |
          # Failures only; the status-alert workflow sends the all-OK message.
          if [ "${{ job.status }}" == "failure" ]; then
            curl -s --max-time 10 -H "Title: DC Record Conflicts CRASHED" -H "Tags: rotating_light" \
              -d "A step failed - check the Actions log." https://ntfy.sh/markalfreddotnews >/dev/null 2>&1 || true
          fi

      - name: Commit today's page
        run: |
          set -euo pipefail
          mkdir -p digest
          if compgen -G "newsletter-*.html" > /dev/null; then
            TODAY_TAG=$(TZ="America/Los_Angeles" date +%Y-%m-%d)
            AM_DATE_FILE="digest/.conflicts-am-date"
            PREV_AM_DATE=$(cat "$AM_DATE_FILE" 2>/dev/null || echo "")
            if [ "$PREV_AM_DATE" != "$TODAY_TAG" ]; then
              cp newsletter-*.html digest/conflicts-am.html
              echo "$TODAY_TAG" > "$AM_DATE_FILE"
              rm -f digest/conflicts-pm.html
            else
              cp newsletter-*.html digest/conflicts-pm.html
            fi
            cp newsletter-*.html digest/conflicts.html
          else
            echo "No page produced this run -- leaving digest/conflicts*.html as-is."
          fi
          git add digest/ archive/ data/conflict-signals.json data/pfd-analysis-seen.json data/stock-act-ledger.json \
            data/donor-awards-seen.json data/donor-awards-cache.json data/trade-award-cache.json 2>/dev/null || git add digest/ archive/
          if ! git diff --cached --quiet; then
            git config user.name "dc-record-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "Update today's Conflicts page [skip ci]"
            bash scripts/push_with_retry.sh
          else
            echo "Page unchanged, nothing to commit."
          fi

      - name: Upload generated page as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-conflicts-${{ github.run_id }}
          path: newsletter-*.html
          if-no-files-found: ignore
          retention-days: 30
