name: DC Record • Officials

on:
  # `schedule:` DISABLED 2026-09-12 -- GitHub's own schedule event was
  # observed firing this and the other editions ~3.5h late every single
  # day (best-effort, no SLA). Replaced by ../scheduler/, a Cloudflare
  # Worker with its own Cron Triggers that calls workflow_dispatch below at
  # the exact times these crons used to (0 10 * * * / 45 22 * * * UTC).
  # schedule:
  #   - cron: '0 10 * * *'    # AM, ~3:00am PT (PDT) -- dispatched with mode:"am"
  #   - cron: '45 22 * * *'   # PM, ~3:45pm PT (PDT) -- dispatched with mode:"pm"
  #                           # See ../scheduler/README.md.
  workflow_dispatch:
    inputs:
      mode:
        description: 'Which subscriber group to email: am or pm (see markalfred.news/dc-record-recipients).'
        required: false
        default: 'am'
      test_recipient_override:
        description: 'Send only to this address instead of the live subscriber list (leave blank for normal recipients)'
        required: false
        default: ''
      site_refresh_only:
        description: "Site-refresh-only run (true/false) -- manual override that generates content but skips sending email and protects the dedupe manifests + digest/officials.html \"latest\" alias."
        required: false
        default: 'false'
      force_resend:
        description: 'Send even if this date+mode already went out (true/false) -- bypasses the duplicate-send guard, see data/sent/.'
        required: false
        default: 'false'

permissions:
  contents: write  # needed to commit the OGE/PFD-PTR dedupe manifests and today's newsletter

concurrency:
  group: dc-record-officials
  cancel-in-progress: false

jobs:
  # Duplicate-send guard (added 2026-10-05, after Cloudflare double-fired the
  # PM cron and every subscriber got two copies). The concurrency group above
  # already queues a second dispatch until the first finishes, so by the time
  # this runs, a real send for the same date+mode has committed its line to
  # data/sent/officials.txt on main. Only applies to real subscriber sends --
  # site_refresh_only/test_recipient_override runs and force_resend always proceed.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Check whether this date+mode was already sent
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ github.event.inputs.mode || 'am' }}
          REAL_SEND: ${{ github.event.inputs.site_refresh_only != 'true' && github.event.inputs.test_recipient_override == '' && github.event.inputs.force_resend != 'true' }}
        run: |
          TODAY=$(TZ=America/Los_Angeles date +%Y-%m-%d)
          SKIP=false
          if [ "$REAL_SEND" == "true" ] && gh api "repos/${{ github.repository }}/contents/data/sent/officials.txt?ref=main" \
              -H "Accept: application/vnd.github.raw" 2>/dev/null | grep -qx "$TODAY $MODE"; then
            SKIP=true
            echo "::notice::officials $MODE edition for $TODAY already sent -- skipping this duplicate dispatch (rerun with force_resend=true to override)."
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

  publish:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/claude" --version
          python3 --version

      - name: Compute today's date
        id: date
        run: echo "today=$(TZ=America/Los_Angeles date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Determine manual skip override
        id: email_decision
        run: |
          MANUAL_SKIP="false"
          if [ "${{ github.event.inputs.site_refresh_only }}" == "true" ]; then
            MANUAL_SKIP="true"
          fi
          echo "manual_skip=$MANUAL_SKIP" >> "$GITHUB_OUTPUT"

      - name: Run OGE fetch script
        run: |
          set +e
          python3 scripts/fetch_oge.py; echo "fetch_oge exit=$?"
          set -e

      # Deterministic sections, built with no LLM (added 2026-10-03) -- see
      # scripts/dc_extras.py. Each writes extras/officials/<name>.json, which
      # assemble.py appends after the main pass; failures never fail the job.
      - name: Run extras scripts (deadlines, ethics agreements, presidential trades, LDA industries)
        env:
          FEC_KEYS: ${{ secrets.FEC_KEYS }}
          MODE: ${{ github.event.inputs.mode || 'am' }}
        run: |
          set +e
          python3 -m pip install --quiet requests >/dev/null 2>&1
          for s in "fetch_deadlines.py --edition officials" fetch_ethics_agreements.py fetch_presidential_trades.py fetch_lda_trends.py fetch_pardon_lobbying.py fetch_stopped_trading.py; do
            timeout 600 python3 scripts/$s; echo "$s exit=$?"
          done
          set -e

      - name: Run mechanical content pass (OGE Ethics Filings, cheap model)
        id: run_mechanical
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Gemini free tier first (scripts/gemini_mechanical.py, 2026-10-30);
          # the Claude Haiku pass below runs only if it fails.
          if python3 scripts/gemini_mechanical.py prompt-officials-mechanical.txt data/oge_candidates.json; then
            exit 0
          fi
          set +e
          cat prompt-officials-mechanical.txt | \
            claude -p \
              --model claude-haiku-4-5-20251001 \
              --permission-mode bypassPermissions \
              --allowedTools "Read,Write" \
              --output-format json > claude_mechanical_result.json
          echo "mechanical exit=$?"
          set -e

          echo "::group::Claude usage/cost (mechanical pass)"
          if jq -e . claude_mechanical_result.json >/dev/null 2>&1; then
            jq -r '"cost_usd=" + (.total_cost_usd|tostring) + "  input_tokens=" + (.usage.input_tokens|tostring) + "  output_tokens=" + (.usage.output_tokens|tostring) + "  cache_read_input_tokens=" + (.usage.cache_read_input_tokens|tostring) + "  num_turns=" + (.num_turns|tostring)' claude_mechanical_result.json
          else
            echo "No valid JSON result -- main pass will use its fallback path. Raw output:"
            cat claude_mechanical_result.json
          fi
          echo "::endgroup::"

          echo "::group::Claude final message (mechanical pass)"
          jq -r '.result // empty' claude_mechanical_result.json 2>/dev/null || true
          echo "::endgroup::"
          exit 0

      # Everything the model used to fetch itself (FARA, LDA, House/Senate
      # disclosures with every PTR parsed, no 30-PTR cap) -- added
      # 2026-10-12. After the OGE pass so the bundle carries its summary.
      # Also reads recent FARA filings for the President, VP and cabinet
      # (up to DC_FARA_SCAN_SEC, default 480s, of OCR per run).
      - name: Fetch FARA, LDA and disclosures; build the model's input bundle (no LLM)
        env:
          MODE: ${{ github.event.inputs.mode || 'am' }}
        run: |
          timeout 1200 python3 scripts/fetch_officials.py || echo "fetch_officials failed"

      - name: Run DC Record • Officials (content generation)
        id: run_edition
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MODE: ${{ github.event.inputs.mode || 'am' }}
        run: |
          TODAY="${{ steps.date.outputs.today }}"
          if [ ! -s data/officials_input.txt ]; then
            echo "fetch_officials.py produced no input bundle" > content_failed.flag
            exit 1
          fi
          if grep -q '^SOURCES UNREACHABLE' data/officials_input.txt; then
            head -1 data/officials_input.txt > content_skipped.flag
            exit 0
          fi
          if [ "$(python3 scripts/gate.py officials)" == "skip" ]; then
            echo "nothing new -- edition written without a model pass" > content_written.flag
            exit 0
          fi
          set +e
          echo "::group::Claude usage/cost (Officials)"
          python3 scripts/run_pass.py prompt-officials.txt data/officials_input.txt \
            "content-$TODAY.json" data/officials_input.json
          CLAUDE_EXIT=$?
          echo "::endgroup::"
          set -e
          if jq -e . "content-$TODAY.json" >/dev/null 2>&1; then
            echo "content written" > content_written.flag
          else
            rm -f "content-$TODAY.json"
            echo "main pass exited $CLAUDE_EXIT without a valid content-$TODAY.json" > content_failed.flag
          fi
          exit $CLAUDE_EXIT

      - name: Assemble final content (append extras, Your Beat box, archive copy)
        if: hashFiles(format('content-{0}.json', steps.date.outputs.today)) != ''
        env:
          MODE: ${{ github.event.inputs.mode || 'am' }}
        run: |
          python3 scripts/assemble.py officials "content-${{ steps.date.outputs.today }}.json"
          python3 scripts/mark_seen.py "content-${{ steps.date.outputs.today }}.json" data/officials_input.json data/pfd-ptr-seen.json || echo "mark_seen failed"
          python3 scripts/mark_seen.py "content-${{ steps.date.outputs.today }}.json" data/fara_items.json data/fara-seen.json || echo "mark_seen (FARA) failed"
          python3 scripts/mark_seen.py "content-${{ steps.date.outputs.today }}.json" data/fara_top_items.json data/fara-top-seen.json || echo "mark_seen (FARA top officials) failed"

      - name: Render newsletter from content JSON
        if: hashFiles(format('content-{0}.json', steps.date.outputs.today)) != ''
        run: |
          python3 scripts/render_officials.py "content-${{ steps.date.outputs.today }}.json" "newsletter-${{ steps.date.outputs.today }}.html"

      - name: Suggest FOIA requests (private, for the /foia tracker)
        # One extra no-tools pass; posts drafts to markalfred.news/foia and never emails anyone.
        if: hashFiles(format('content-{0}.json', steps.date.outputs.today)) != ''
        continue-on-error: true
        timeout-minutes: 10
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          FOIA_INGEST_TOKEN: ${{ secrets.FOIA_INGEST_TOKEN }}
        run: python3 scripts/suggest_foias.py officials "content-${{ steps.date.outputs.today }}.json"

      - name: Send email
        if: hashFiles(format('newsletter-{0}.html', steps.date.outputs.today)) != ''
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DC_RECORD_RECIPIENTS_TOKEN: ${{ secrets.DC_RECORD_RECIPIENTS_TOKEN }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then MODE="am"; fi
          if [ "${{ steps.email_decision.outputs.manual_skip }}" == "true" ]; then
            echo "manual site_refresh_only input -- not sending" > email_skipped.flag
          elif [ -n "${{ github.event.inputs.test_recipient_override }}" ]; then
            python3 scripts/send_email.py \
              "newsletter-${{ steps.date.outputs.today }}.html" \
              "DC Record • Officials • ${{ steps.date.outputs.today }}" \
              --from "DC Record • Officials <newsletter@markalfred.news>" \
              --to "${{ github.event.inputs.test_recipient_override }}"
          else
            EMAILS=$(curl -s -H "Authorization: Bearer $DC_RECORD_RECIPIENTS_TOKEN" \
              "https://markalfred.news/dc-record-recipients?edition=officials&mode=$MODE" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); sys.exit('recipients endpoint error: ' + json.dumps(d)[:300]) if 'emails' not in d else print(','.join(d['emails']))") \
              || { echo "recipients lookup failed (bad token or endpoint down)" > email_failed.flag; exit 1; }
            if [ -z "$EMAILS" ]; then
              echo "no subscribers for officials/$MODE -- not sending" > email_skipped.flag
            else
              python3 scripts/send_email.py \
                "newsletter-${{ steps.date.outputs.today }}.html" \
                "DC Record • Officials • ${{ steps.date.outputs.today }}" \
                --from "DC Record • Officials <newsletter@markalfred.news>" \
                --to "$EMAILS"
            fi
          fi

      - name: Push ntfy notification of this run's outcome
        if: always()
        run: |
          notify() {
            curl -s --max-time 10 -H "Title: $1" -H "Tags: $2" -d "$3" \
              https://ntfy.sh/markalfreddotnews >/dev/null 2>&1 || true
          }
          # Failures only -- success/skipped runs are intentionally silent; the
          # status-alert workflow sends one ntfy once all 4 editions finish OK.
          if [ -f email_failed.flag ]; then
            notify "DC Record Officials FAILED" "rotating_light" "$(cat email_failed.flag)"
          elif [ -f content_failed.flag ]; then
            notify "DC Record Officials content FAILED" "rotating_light" "$(cat content_failed.flag)"
          elif [ "${{ job.status }}" == "failure" ]; then
            notify "DC Record Officials CRASHED" "rotating_light" "A step failed with no status flag written — check the Actions log."
          fi

      # Also mirrors today's newsletter to a fixed repo path (digest/officials.html)
      # so the markalfredsite /dc-record Pages Function can read it straight
      # from this repo's git history via GitHub's Contents API.
      - name: Commit updated manifests and today's newsletter
        if: always()
        run: |
          set -euo pipefail
          IS_SITE_REFRESH="true"
          if [ -f email_sent.flag ]; then
            IS_SITE_REFRESH="false"
          fi
          # Record a real subscriber send so the guard job skips a duplicate dispatch of this slot.
          if [ "$IS_SITE_REFRESH" == "false" ] && [ -z "${{ github.event.inputs.test_recipient_override }}" ]; then
            mkdir -p data/sent
            echo "${{ steps.date.outputs.today }} ${{ github.event.inputs.mode || 'am' }}" >> data/sent/officials.txt
            git add data/sent/officials.txt
          fi
          mkdir -p digest
          if compgen -G "newsletter-*.html" > /dev/null; then
            # AM/PM comes from the dispatch `mode` input, not from run order: if the AM run failed,
            # the PM run must not be filed (and labeled) as AM.
            SLOT="${{ github.event.inputs.mode }}"
            if [ "$SLOT" == "pm" ]; then
              cp newsletter-*.html digest/officials-pm.html
            else
              cp newsletter-*.html digest/officials-am.html
              rm -f digest/officials-pm.html
            fi
            if [ "$IS_SITE_REFRESH" == "true" ]; then
              echo "Site-refresh-only (no-email) run -- leaving digest/officials.html on the real AM edition."
            else
              cp newsletter-*.html digest/officials.html
            fi
          else
            echo "No newsletter file produced this run (likely a skipped/failed run) -- leaving digest/officials*.html as-is."
          fi
          # A site-refresh-only run still lets Claude update the PFD-PTR/OGE
          # dedupe manifests on disk as part of its normal task instructions --
          # revert those specific files before staging so nothing gets marked
          # "seen" without ever having been emailed; tomorrow's real run will
          # naturally re-find and correctly email whatever this run scraped
          # first.
          if [ "$IS_SITE_REFRESH" == "true" ]; then
            git checkout -- data/pfd-ptr-seen.json data/fara-seen.json data/fara-top-seen.json data/oge-filings-seen.json data/ethics-tracker-seen.json data/presidential-trades-seen.json data/pardon-lobbying-seen.json data/stopped-trading-seen.json data/lda-trends-seen.json data/stock-act-ledger.json 2>/dev/null || true
          fi
          git add data/pfd-ptr-seen.json data/fara-seen.json data/fara-top-seen.json data/fara-top-scanned.json \
            data/oge-filings-seen.json data/ethics-tracker-seen.json \
            data/presidential-trades-seen.json data/ethics-agreements.json data/pardon-lobbying-seen.json data/stopped-trading-seen.json data/lda-trends-seen.json \
            data/stock-act-ledger.json digest/ archive/
          if ! git diff --cached --quiet; then
            git config user.name "dc-record-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "Update PFD-PTR/OGE manifests and today's newsletter [skip ci]"
            bash scripts/push_with_retry.sh
          else
            echo "Manifests and newsletter unchanged, nothing to commit."
          fi

      - name: Upload generated newsletter as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-officials-${{ github.run_id }}
          path: newsletter-*.html
          if-no-files-found: ignore
          retention-days: 30
