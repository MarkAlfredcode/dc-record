name: DC Record • status alert

# Fires one ntfy notification per AM window and one per PM window, once
# all 3 editions' run for that window has finished -- either "all 3
# ready" or a plain explanation of whatever went wrong (a real crash),
# never silence. Replaces the old dc-record-pm-alert.yml (2026-09-13),
# which only ever notified on the all-success case and stayed completely
# silent if an edition had actually failed.
#
# Event-driven off each edition's own workflow completing (workflow_run)
# rather than a fixed clock time, so it's immune to GitHub's own
# scheduling drift (confirmed elsewhere in this repo to run hours late
# some days) -- whichever of the 3 completes last is what actually
# triggers the "all 3 done" check. scripts/check_editions_status.py does
# the actual classification (see its own docstring) and is invoked twice
# per trigger, once for each window -- it's cheap to check both every
# time rather than try to guess which window "now" belongs to, and each
# has its own dedupe marker (digest/.am-alert-date / .pm-alert-date) so a
# same-day repeat trigger doesn't resend.
#
# workflow_run fires on EVERY completion of these 3 workflows (both the
# AM real-send and the PM run, 6 times/day), so most invocations of this
# checker will correctly find "not all 3 done yet" for at least one
# window and stay quiet for it -- that's expected, not an error.

on:
  workflow_run:
    workflows:
      - "DC Record • Campaigns"
      - "DC Record • Congress"
      - "DC Record • Conflicts"
      - "DC Record • The Feds"
      - "DC Record • Officials"
    types: [completed]
  # Safety net for a dispatch that never happened (no workflow_run would ever fire):
  schedule:
    - cron: '30 18 * * *'   # ~11:30am PT (AM batch runs ~7am)
    - cron: '30 3 * * *'    # ~8:30pm PT
  workflow_dispatch: {}

permissions:
  contents: write # needed to commit the dedupe markers
  actions: read # needed for `gh run list` to see the 3 editions' run history

concurrency:
  group: dc-record-status-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check AM window
        run: python3 scripts/check_editions_status.py am

      - name: Check PM window
        run: python3 scripts/check_editions_status.py pm

      - name: Commit any newly-written dedupe markers
        run: |
          set -euo pipefail
          # Added separately, not as one `git add a b` -- git add fails (and
          # stages NEITHER path) if even one pathspec doesn't match, and on
          # a normal day only one of the two markers is newly written per
          # run (confirmed by hand).
          [ -f digest/.am-alert-date ] && git add digest/.am-alert-date || true
          [ -f digest/.pm-alert-date ] && git add digest/.pm-alert-date || true
          [ -f digest/.am-missing-alert-date ] && git add digest/.am-missing-alert-date || true
          [ -f digest/.pm-missing-alert-date ] && git add digest/.pm-missing-alert-date || true
          if git diff --cached --quiet; then
            echo "No new alert sent this run -- nothing to commit."
            exit 0
          fi
          git config user.name "dc-record-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Record today's DC Record status alert [skip ci]"
          # The 3 edition workflows (and each other's manifest commits) can
          # also be pushing to main around this same time -- rebase-and-
          # retry on a non-fast-forward push, same pattern used throughout
          # this repo's other commit steps.
          bash scripts/push_with_retry.sh
