name: DC Record • Executive Branch

on:
  # `schedule:` DISABLED 2026-09-12 -- GitHub's own schedule event was
  # observed firing this and the other 3 editions ~3.5h late every single
  # day (best-effort, no SLA). Replaced by ../scheduler/, a Cloudflare
  # Worker with its own Cron Triggers that calls workflow_dispatch below at
  # the exact times these crons used to (0 10 * * * / 45 22 * * * UTC),
  # passing `site_refresh_only: "true"` on the 45 22 dispatch in place of
  # the old `github.event.schedule == '45 22 * * *'` check.
  # schedule:
  #   - cron: '0 10 * * *'    # AM, ~3:00am PT (PDT)
  #   - cron: '45 22 * * *'   # PM site-refresh, ~3:45pm PT (PDT) -- reverts
  #                           # the omb-spend-plan/usaspending-contracts/
  #                           # oge-filings-seen manifests before committing
  #                           # and skips advancing digest/executive.html
  workflow_dispatch:
    inputs:
      test_recipient_override:
        description: 'Send only to this address instead of the normal 3-person list (leave blank for normal recipients)'
        required: false
        default: ''
      site_refresh_only:
        description: 'Site-refresh-only run (true/false) -- generates content but skips sending email and protects the dedupe manifests + digest/executive.html "latest" alias, same as the old 3:45pm schedule slot'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: dc-record-contracts
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/claude" --version
          python3 --version

      - name: Compute today's date
        id: date
        run: echo "today=$(TZ=America/Los_Angeles date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # Single source of truth for "will this run actually send an email" --
      # reused by the network-issue-notice step, the Send email step, and
      # the Commit step, which needs the same answer to decide whether to
      # protect the dedupe manifests and the site's "latest" alias from an
      # unsent run.
      - name: Determine whether this run will send email
        id: email_decision
        run: |
          SKIP="false"
          if [ "${{ github.event.inputs.site_refresh_only }}" == "true" ]; then
            SKIP="true"
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      # 2026-09-12 architecture change: these 5 scripts do all the fully-
      # mechanical fetch/paginate/filter/dedupe/flag work that used to happen
      # inside Claude's own reasoning (73 turns / 8.6M cache-read tokens /
      # $3.18 on 2026-09-11, the worst of the 4 DC Record editions) --
      # see /Users/mark/.claude/plans/imperative-brewing-lerdorf.md. Claude's
      # job narrows to reading their pre-digested candidates JSON and writing
      # the prose/judgment calls that can't be scripted.
      - name: Run fetch/filter scripts
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
        run: |
          # Run from the repo root, NOT `cd scripts` -- these scripts write
          # to relative data/*.json paths expecting the repo root as cwd.
          # (Python still finds dc_common.py fine either way: it adds the
          # executed script's own directory to sys.path[0] regardless of
          # cwd.) Confirmed by hand: `cd scripts` first made every fetch
          # silently write to scripts/data/ instead, which the reachability
          # check then read as "fetch script did not run" for all 5 and
          # wrongly triggered the 3+-down skip path.
          set +e
          python3 scripts/fetch_omb.py; echo "fetch_omb exit=$?"
          python3 scripts/fetch_usaspending.py; echo "fetch_usaspending exit=$?"
          python3 scripts/fetch_sam.py; echo "fetch_sam exit=$?"
          python3 scripts/fetch_oge.py; echo "fetch_oge exit=$?"
          python3 scripts/fetch_fedregister.py; echo "fetch_fedregister exit=$?"
          set -e

      # Mechanical: "3+ of 5 sources unreachable -> skip and notify" used to
      # be Claude's own judgment call reading its own connectivity-check
      # curls; now it's just counting a boolean field 5 scripts already
      # reported, so it happens here instead of costing a turn.
      - name: Check source reachability
        id: reachability
        run: |
          DOWN=$(python3 -c "
          import json
          files = ['omb_candidates.json','usaspending_candidates.json','sam_candidates.json','oge_candidates.json','fedregister_candidates.json']
          hosts = ['openomb.org/apportionment-public.max.gov','api.usaspending.gov','api.sam.gov','extapps2.oge.gov','www.federalregister.gov']
          down = []
          for f, h in zip(files, hosts):
              try:
                  d = json.load(open(f'data/{f}'))
                  if d.get('reachable') is False:
                      down.append(h)
              except FileNotFoundError:
                  down.append(h + ' (fetch script did not run)')
          print(','.join(down))
          ")
          COUNT=$(echo -n "$DOWN" | tr ',' '\n' | grep -c . || true)
          echo "down_hosts=$DOWN" >> "$GITHUB_OUTPUT"
          echo "down_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Down hosts: $DOWN ($COUNT)"

      - name: Send network-issue notice and skip (3+ sources down)
        if: steps.reachability.outputs.down_count >= 3 && steps.email_decision.outputs.skip != 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python3 scripts/send_notice.py "${{ steps.reachability.outputs.down_hosts }}"

      - name: Run DC Record • Executive Branch (content generation)
        id: run_edition
        if: steps.reachability.outputs.down_count < 3
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set +e
          cat prompt-contracts.txt | \
            claude -p \
              --permission-mode bypassPermissions \
              --allowedTools "Read,Write" \
              --output-format json > claude_result.json
          CLAUDE_EXIT=$?
          set -e

          echo "::group::Claude usage/cost (Executive Branch)"
          if jq -e . claude_result.json >/dev/null 2>&1; then
            jq -r '"cost_usd=" + (.total_cost_usd|tostring) + "  input_tokens=" + (.usage.input_tokens|tostring) + "  output_tokens=" + (.usage.output_tokens|tostring) + "  cache_creation_input_tokens=" + (.usage.cache_creation_input_tokens|tostring) + "  cache_read_input_tokens=" + (.usage.cache_read_input_tokens|tostring) + "  duration_ms=" + (.duration_ms|tostring) + "  num_turns=" + (.num_turns|tostring)' claude_result.json
          else
            echo "No valid JSON result (likely errored before completion, e.g. a session-limit preflight failure). Raw output:"
            cat claude_result.json
          fi
          echo "::endgroup::"

          echo "::group::Claude final message (Executive Branch)"
          jq -r '.result // empty' claude_result.json 2>/dev/null || true
          echo "::endgroup::"

          exit $CLAUDE_EXIT

      - name: Render newsletter from content JSON
        if: steps.reachability.outputs.down_count < 3 && hashFiles(format('content-{0}.json', steps.date.outputs.today)) != ''
        run: |
          python3 scripts/render_contracts.py "content-${{ steps.date.outputs.today }}.json" "newsletter-${{ steps.date.outputs.today }}.html"

      - name: Send email
        if: steps.reachability.outputs.down_count < 3 && hashFiles(format('newsletter-{0}.html', steps.date.outputs.today)) != ''
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ "${{ steps.email_decision.outputs.skip }}" == "true" ]; then
            echo "3:45pm site-refresh-only schedule -- not sending" > email_skipped.flag
          else
            TO_ARG=""
            if [ -n "${{ github.event.inputs.test_recipient_override }}" ]; then
              TO_ARG="--to ${{ github.event.inputs.test_recipient_override }}"
            fi
            python3 scripts/send_email.py \
              "newsletter-${{ steps.date.outputs.today }}.html" \
              "DC Record • Executive Branch • ${{ steps.date.outputs.today }}" \
              $TO_ARG
          fi

      - name: Push ntfy notification of this run's outcome
        if: always()
        run: |
          notify() {
            curl -s --max-time 10 -H "Title: $1" -H "Tags: $2" -d "$3" \
              https://ntfy.sh/markalfreddotnews >/dev/null 2>&1 || true
          }
          if [ -f email_sent.flag ]; then
            notify "DC Record Executive Branch sent" "email" "$(cat email_sent.flag)"
          elif [ -f email_failed.flag ]; then
            notify "DC Record Executive Branch FAILED" "rotating_light" "$(cat email_failed.flag)"
          elif [ -f email_skipped.flag ]; then
            notify "DC Record Executive Branch skipped" "warning" "$(cat email_skipped.flag)"
          elif [ -f content_failed.flag ]; then
            notify "DC Record Executive Branch content FAILED" "rotating_light" "$(cat content_failed.flag)"
          elif [ -f content_skipped.flag ]; then
            notify "DC Record Executive Branch content skipped" "warning" "$(cat content_skipped.flag)"
          elif [ "${{ steps.run_edition.outcome }}" == "failure" ]; then
            notify "DC Record Executive Branch CRASHED" "rotating_light" "Run step failed with no status flag written — check the Actions log."
          else
            notify "DC Record Executive Branch: unknown outcome" "warning" "Run finished but wrote no status flag — check the Actions log."
          fi

      # Also mirrors today's newsletter to a fixed repo path (digest/executive.html)
      # so the DC Record Digest routine can read it straight from its own git
      # checkout -- GitHub Actions' build-artifact download redirects to Azure
      # Blob Storage, which that routine's cloud sandbox cannot reach (confirmed
      # live 2026-09-05), so a committed file is the reliable path.
      - name: Commit updated manifests and today's newsletter
        run: |
          set -euo pipefail
          IS_SITE_REFRESH="${{ steps.email_decision.outputs.skip }}"
          mkdir -p digest
          if compgen -G "newsletter-*.html" > /dev/null; then
            # AM/PM edition snapshots -- see dc-record-fec.yml's commit step
            # for the full rationale, including why a site-refresh-only run
            # never advances digest/executive.html.
            TODAY_TAG=$(TZ="America/Los_Angeles" date +%Y-%m-%d)
            AM_DATE_FILE="digest/.executive-am-date"
            PREV_AM_DATE=$(cat "$AM_DATE_FILE" 2>/dev/null || echo "")
            if [ "$PREV_AM_DATE" != "$TODAY_TAG" ]; then
              cp newsletter-*.html digest/executive-am.html
              echo "$TODAY_TAG" > "$AM_DATE_FILE"
              rm -f digest/executive-pm.html
            else
              cp newsletter-*.html digest/executive-pm.html
            fi
            if [ "$IS_SITE_REFRESH" == "true" ]; then
              echo "Site-refresh-only (no-email) run -- leaving digest/executive.html on the real AM edition."
            else
              cp newsletter-*.html digest/executive.html
            fi
          else
            echo "No newsletter file produced this run (likely a skipped/failed run) -- leaving digest/executive*.html as-is."
          fi
          # See dc-record-fec.yml's commit step for the full rationale --
          # these 3 are this edition's "seen" dedupe manifests (written by
          # the fetch scripts above), so a site-refresh-only run reverts
          # them before staging rather than letting today's scrape get
          # marked seen without ever having been emailed.
          if [ "$IS_SITE_REFRESH" == "true" ]; then
            git checkout -- data/omb-spend-plan-manifest.json data/omb-apportionment-manifest.json data/usaspending-contracts-manifest.json data/oge-filings-seen.json 2>/dev/null || true
          fi
          # `git add` before the diff check, and check --cached rather than
          # the working-tree diff -- a brand-new untracked file (e.g. the
          # first-ever digest/executive-pm.html) is invisible to a plain
          # `git diff`, which would silently skip the commit entirely
          # (confirmed live 2026-09-12).
          git add data/omb-spend-plan-manifest.json data/omb-apportionment-manifest.json data/usaspending-contracts-manifest.json data/oge-filings-seen.json digest/
          if ! git diff --cached --quiet; then
            git config user.name "dc-record-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "Update manifests and today's newsletter [skip ci]"
            # Campaigns & Congress's manifest-commit step runs on the same
            # cron slot and can push to this same branch around the same
            # time -- rebase-and-retry on a non-fast-forward push instead of
            # failing outright (confirmed happening live 2026-09-05).
            PUSHED=false
            for i in 1 2 3 4 5; do
              if git push; then
                PUSHED=true
                break
              fi
              echo "Push rejected (attempt $i/5), rebasing onto latest and retrying..."
              git pull --rebase
              sleep $((RANDOM % 5 + 1))
            done
            $PUSHED
          else
            echo "Manifests and newsletter unchanged, nothing to commit."
          fi

      - name: Upload generated newsletter as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-contracts-${{ github.run_id }}
          path: newsletter-*.html
          if-no-files-found: ignore
          retention-days: 30
