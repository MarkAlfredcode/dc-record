name: DC Record • Lobbying

on:
  # `schedule:` DISABLED 2026-09-12 -- GitHub's own schedule event was
  # observed firing this and the other 3 editions ~3.5h late every single
  # day (best-effort, no SLA). Replaced by ../scheduler/, a Cloudflare
  # Worker with its own Cron Triggers that calls workflow_dispatch below at
  # the exact times these crons used to (0 10 * * * / 45 22 * * * UTC).
  # schedule:
  #   - cron: '0 10 * * *'    # AM, ~3:00am PT (PDT) -- dispatched with mode:"am"
  #   - cron: '45 22 * * *'   # PM, ~3:45pm PT (PDT) -- dispatched with mode:"pm"
  #                           # See ../scheduler/README.md.
  workflow_dispatch:
    inputs:
      mode:
        description: 'Which subscriber group to email: am or pm (see markalfred.news/dc-record-recipients). 2026-09-16: PM used to be a hardcoded no-email site-refresh; now it really sends, but only to subscribers who opted into the PM edition -- if nobody has, it still quietly no-ops (email_skipped.flag), same visible effect as before.'
        required: false
        default: 'am'
      test_recipient_override:
        description: 'Send only to this address instead of the live subscriber list (leave blank for normal recipients)'
        required: false
        default: ''
      site_refresh_only:
        description: "Site-refresh-only run (true/false) -- manual override that generates content but skips sending email and protects digest/lobbying.html's \"latest\" alias. The scheduler no longer sets this for the PM slot -- see mode above."
        required: false
        default: 'false'

permissions:
  contents: write  # needed to commit today's newsletter to digest/lobbying.html

concurrency:
  group: dc-record-lobbying
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/claude" --version
          python3 --version

      - name: Compute today's date
        id: date
        run: echo "today=$(TZ=America/Los_Angeles date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # Just the MANUAL override signal now -- not the full "will this run
      # send" answer, since that also depends on live subscriber counts,
      # which aren't known until the Send email step actually queries them.
      # The Commit step below derives its own answer from whether that step
      # actually wrote email_sent.flag, not from this.
      - name: Determine manual skip override
        id: email_decision
        run: |
          MANUAL_SKIP="false"
          if [ "${{ github.event.inputs.site_refresh_only }}" == "true" ]; then
            MANUAL_SKIP="true"
          fi
          echo "manual_skip=$MANUAL_SKIP" >> "$GITHUB_OUTPUT"

      # 2026-09-12 architecture change: Claude no longer writes the final
      # HTML or sends the email itself -- it writes content-TODAY.json (see
      # prompt-lobbying.txt's OUTPUT FORMAT section) and
      # scripts/render_lobbying.py + scripts/send_email.py below take it
      # from there. This edition still does its own fetching via Bash
      # exactly as before.
      - name: Run DC Record • Lobbying (content generation)
        id: run_edition
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set +e
          cat prompt-lobbying.txt | \
            claude -p \
              --permission-mode bypassPermissions \
              --allowedTools "Bash,Read,Write,Edit,Glob,Grep" \
              --output-format json > claude_result.json
          CLAUDE_EXIT=$?
          set -e

          echo "::group::Claude usage/cost (Lobbying)"
          if jq -e . claude_result.json >/dev/null 2>&1; then
            jq -r '"cost_usd=" + (.total_cost_usd|tostring) + "  input_tokens=" + (.usage.input_tokens|tostring) + "  output_tokens=" + (.usage.output_tokens|tostring) + "  cache_creation_input_tokens=" + (.usage.cache_creation_input_tokens|tostring) + "  cache_read_input_tokens=" + (.usage.cache_read_input_tokens|tostring) + "  duration_ms=" + (.duration_ms|tostring) + "  num_turns=" + (.num_turns|tostring)' claude_result.json
          else
            echo "No valid JSON result (likely errored before completion, e.g. a session-limit preflight failure). Raw output:"
            cat claude_result.json
          fi
          echo "::endgroup::"

          echo "::group::Claude final message (Lobbying)"
          jq -r '.result // empty' claude_result.json 2>/dev/null || true
          echo "::endgroup::"

          exit $CLAUDE_EXIT

      - name: Render newsletter from content JSON
        if: hashFiles(format('content-{0}.json', steps.date.outputs.today)) != ''
        run: |
          python3 scripts/render_lobbying.py "content-${{ steps.date.outputs.today }}.json" "newsletter-${{ steps.date.outputs.today }}.html"

      - name: Send email
        if: hashFiles(format('newsletter-{0}.html', steps.date.outputs.today)) != ''
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DC_RECORD_RECIPIENTS_TOKEN: ${{ secrets.DC_RECORD_RECIPIENTS_TOKEN }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then MODE="am"; fi
          if [ "${{ steps.email_decision.outputs.manual_skip }}" == "true" ]; then
            echo "manual site_refresh_only input -- not sending" > email_skipped.flag
          elif [ -n "${{ github.event.inputs.test_recipient_override }}" ]; then
            python3 scripts/send_email.py \
              "newsletter-${{ steps.date.outputs.today }}.html" \
              "DC Record • Lobbying • ${{ steps.date.outputs.today }}" \
              --from "DC Record • Lobbying <newsletter@markalfred.news>" \
              --to "${{ github.event.inputs.test_recipient_override }}"
          else
            EMAILS=$(curl -s -H "Authorization: Bearer $DC_RECORD_RECIPIENTS_TOKEN" \
              "https://markalfred.news/dc-record-recipients?edition=lobbying&mode=$MODE" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print(','.join(d.get('emails', [])))")
            if [ -z "$EMAILS" ]; then
              echo "no subscribers for lobbying/$MODE -- not sending" > email_skipped.flag
            else
              python3 scripts/send_email.py \
                "newsletter-${{ steps.date.outputs.today }}.html" \
                "DC Record • Lobbying • ${{ steps.date.outputs.today }}" \
                --from "DC Record • Lobbying <newsletter@markalfred.news>" \
                --to "$EMAILS"
            fi
          fi

      - name: Push ntfy notification of this run's outcome
        if: always()
        run: |
          notify() {
            curl -s --max-time 10 -H "Title: $1" -H "Tags: $2" -d "$3" \
              https://ntfy.sh/markalfreddotnews >/dev/null 2>&1 || true
          }
          if [ -f email_sent.flag ]; then
            notify "DC Record Lobbying sent" "email" "$(cat email_sent.flag)"
          elif [ -f email_skipped.flag ]; then
            notify "DC Record Lobbying: no email sent" "test_tube" "$(cat email_skipped.flag)"
          elif [ -f email_failed.flag ]; then
            notify "DC Record Lobbying FAILED" "rotating_light" "$(cat email_failed.flag)"
          elif [ -f content_skipped.flag ]; then
            notify "DC Record Lobbying skipped" "warning" "$(cat content_skipped.flag)"
          elif [ -f content_failed.flag ]; then
            notify "DC Record Lobbying content FAILED" "rotating_light" "$(cat content_failed.flag)"
          elif [ "${{ steps.run_edition.outcome }}" == "failure" ]; then
            notify "DC Record Lobbying CRASHED" "rotating_light" "Run step failed with no status flag written — check the Actions log."
          else
            notify "DC Record Lobbying: unknown outcome" "warning" "Run finished but wrote no status flag — check the Actions log."
          fi

      # Mirrors today's newsletter to a fixed repo path (digest/lobbying.html)
      # so the DC Record Digest routine can read it straight from its own git
      # checkout -- GitHub Actions' build-artifact download redirects to Azure
      # Blob Storage, which that routine's cloud sandbox cannot reach (confirmed
      # live 2026-09-05), so a committed file is the reliable path.
      - name: Commit today's newsletter
        run: |
          set -euo pipefail
          # Derived from the actual send outcome -- see dc-record-fec.yml's
          # Commit step for the full rationale.
          IS_SITE_REFRESH="true"
          if [ -f email_sent.flag ]; then
            IS_SITE_REFRESH="false"
          fi
          mkdir -p digest
          if compgen -G "newsletter-*.html" > /dev/null; then
            # AM/PM edition snapshots -- see dc-record-fec.yml's commit step
            # for the full rationale, including why a site-refresh-only run
            # never advances digest/lobbying.html.
            TODAY_TAG=$(TZ="America/Los_Angeles" date +%Y-%m-%d)
            AM_DATE_FILE="digest/.lobbying-am-date"
            PREV_AM_DATE=$(cat "$AM_DATE_FILE" 2>/dev/null || echo "")
            if [ "$PREV_AM_DATE" != "$TODAY_TAG" ]; then
              cp newsletter-*.html digest/lobbying-am.html
              echo "$TODAY_TAG" > "$AM_DATE_FILE"
              rm -f digest/lobbying-pm.html
            else
              cp newsletter-*.html digest/lobbying-pm.html
            fi
            if [ "$IS_SITE_REFRESH" == "true" ]; then
              echo "Site-refresh-only (no-email) run -- leaving digest/lobbying.html on the real AM edition."
            else
              cp newsletter-*.html digest/lobbying.html
            fi
          else
            echo "No newsletter file produced this run (likely a skipped/failed run) -- leaving digest/lobbying*.html as-is."
          fi
          # `git add` before the diff check, and check --cached rather than
          # the working-tree diff -- a brand-new untracked file (e.g. the
          # first-ever digest/lobbying-pm.html) is invisible to a plain
          # `git diff`, which would silently skip the commit entirely
          # (confirmed live 2026-09-12: this edition's very first PM
          # snapshot never got committed because of exactly this).
          git add digest/
          if ! git diff --cached --quiet; then
            git config user.name "dc-record-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "Update today's newsletter [skip ci]"
            # Executive Branch and Campaigns & Congress also push to main on
            # this same cron slot -- rebase-and-retry on a non-fast-forward
            # push instead of failing outright (same race confirmed live
            # 2026-09-05 between those two).
            PUSHED=false
            for i in 1 2 3 4 5; do
              if git push; then
                PUSHED=true
                break
              fi
              echo "Push rejected (attempt $i/5), rebasing onto latest and retrying..."
              git pull --rebase
              sleep $((RANDOM % 5 + 1))
            done
            $PUSHED
          else
            echo "Newsletter unchanged, nothing to commit."
          fi

      - name: Upload generated newsletter as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-lobbying-${{ github.run_id }}
          path: newsletter-*.html
          if-no-files-found: ignore
          retention-days: 30
