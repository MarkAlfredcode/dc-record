name: DC Record • Congress

on:
  # `schedule:` DISABLED -- GitHub's own schedule event was observed firing
  # this and the other editions ~3.5h late every single day (best-effort,
  # no SLA). Replaced by ../scheduler/, a Cloudflare Worker with its own
  # Cron Triggers that calls workflow_dispatch below at the exact times
  # these crons used to (25 10 * * * / 10 23 * * * UTC). As of 2026-10-03
  # it's dispatched with the other 3 editions at 0 10 / 45 22 UTC instead.
  # This edition never emails either way, so both dispatches are identical
  # (no skip_email/site_refresh_only input needed).
  # schedule:
  #   - cron: '25 10 * * *'   # AM, ~3:25am PT (PDT)
  #   - cron: '10 23 * * *'   # PM site-refresh, ~4:10pm PT (PDT)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dc-record-congress
  cancel-in-progress: false

jobs:
  # Duplicate-dispatch guard (added 2026-10-10). Cloudflare has been firing
  # each cron twice, and this edition doesn't email, so it has no data/sent/
  # line to check like the emailing editions' guard. Instead: skip if another
  # dispatch of this same workflow was created in the 10 minutes before this
  # one. Fails open (runs anyway) if the API can't be asked. A manual rerun
  # within 10 minutes of a real one is skipped too -- wait it out.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Check whether this slot was already dispatched
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          SKIP=false
          if ME=$(gh api "repos/$REPO/actions/runs/$RUN_ID"); then
            WF=$(jq -r .workflow_id <<<"$ME")
            CREATED=$(jq -r .created_at <<<"$ME")
            SINCE=$(date -u -d "@$(( $(date -u -d "$CREATED" +%s) - 600 ))" +%Y-%m-%dT%H:%M:%SZ)
            EARLIER=$(gh api "repos/$REPO/actions/workflows/$WF/runs?event=workflow_dispatch&per_page=20&created=$SINCE..$CREATED" \
              --jq "[.workflow_runs[] | select(.id < $RUN_ID)] | length" || echo 0)
            if [ "${EARLIER:-0}" -gt 0 ]; then
              SKIP=true
              echo "::notice::another dispatch of this workflow was created between $SINCE and $CREATED -- skipping this duplicate."
            fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

  publish:
    needs: guard
    # !cancelled(): if the guard job itself errors, still run (fail open).
    if: ${{ !cancelled() && needs.guard.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/claude" --version
          python3 --version

      - name: Compute today's date
        id: date
        run: echo "today=$(TZ=America/Los_Angeles date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # Claude writes content-TODAY.json (see prompt-congress.txt's OUTPUT
      # FORMAT section) and scripts/render_congress.py below takes it from
      # there. This edition does its own fetching via Bash; no email is
      # sent for this edition either way.
      # Extras first, so the model can weigh them for Top Story (they used
      # to run after the model pass, which never saw them).
      - name: Run extras scripts (missed votes, discharge petitions)
        run: |
          if [ "$(date -u +%H)" -lt 18 ]; then export MODE=am; else export MODE=pm; fi
          set +e
          for s in fetch_absences.py fetch_discharge.py; do
            timeout 600 python3 scripts/$s; echo "$s exit=$?"
          done
          set -e

      # Everything the model used to fetch itself (govinfo issue, Daily
      # Digest, introductions, congress.gov sponsors) -- added 2026-10-12.
      - name: Fetch the Congressional Record (no LLM)
        env:
          FEC_KEYS: ${{ secrets.FEC_KEYS }}
        run: |
          timeout 600 python3 scripts/fetch_congress.py || echo "fetch_congress failed"

      - name: Run DC Record • Congress (content generation)
        id: run_edition
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          TODAY="${{ steps.date.outputs.today }}"
          if [ ! -s data/congress_input.txt ]; then
            echo "fetch_congress.py produced no input bundle" > digest_failed.flag
            exit 1
          fi
          if grep -q '^GOVINFO UNREACHABLE\|^NO ISSUE' data/congress_input.txt; then
            head -1 data/congress_input.txt > digest_skipped.flag
            exit 0
          fi
          # Same Record issue as an earlier edition -> carry its summary over
          # (gate.py writes content-TODAY.json); only the extras are new.
          if [ "$(python3 scripts/gate.py congress)" == "skip" ]; then
            echo "no new Record issue -- summary carried over, extras refreshed" > digest_written.flag
            exit 0
          fi
          set +e
          echo "::group::Claude usage/cost (Congress)"
          python3 scripts/run_pass.py prompt-congress.txt data/congress_input.txt \
            "content-$TODAY.json" data/congress_input.json
          CLAUDE_EXIT=$?
          echo "::endgroup::"
          set -e
          if jq -e . "content-$TODAY.json" >/dev/null 2>&1; then
            python3 scripts/gate.py record-congress "content-$TODAY.json"
            echo "content written" > digest_written.flag
          else
            rm -f "content-$TODAY.json"
            echo "main pass exited $CLAUDE_EXIT without a valid content-$TODAY.json" > digest_failed.flag
          fi
          exit $CLAUDE_EXIT

      - name: Assemble final content (Your Beat box, archive copy)
        if: hashFiles(format('content-{0}.json', steps.date.outputs.today)) != ''
        run: |
          if [ "$(date -u +%H)" -lt 18 ]; then export MODE=am; else export MODE=pm; fi
          python3 scripts/assemble.py congress "content-${{ steps.date.outputs.today }}.json"

      - name: Render page from content JSON
        if: hashFiles(format('content-{0}.json', steps.date.outputs.today)) != ''
        run: |
          python3 scripts/render_congress.py "content-${{ steps.date.outputs.today }}.json" "newsletter-${{ steps.date.outputs.today }}.html"

      - name: Suggest FOIA requests (private, for the /foia tracker)
        # One extra no-tools pass; posts drafts to markalfred.news/foia and never emails anyone.
        if: hashFiles(format('content-{0}.json', steps.date.outputs.today)) != ''
        continue-on-error: true
        timeout-minutes: 10
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          FOIA_INGEST_TOKEN: ${{ secrets.FOIA_INGEST_TOKEN }}
        run: python3 scripts/suggest_foias.py congress "content-${{ steps.date.outputs.today }}.json"

      - name: Push ntfy notification of this run's outcome
        if: always()
        run: |
          notify() {
            curl -s --max-time 10 -H "Title: $1" -H "Tags: $2" -d "$3" \
              https://ntfy.sh/markalfreddotnews >/dev/null 2>&1 || true
          }
          # Failures only -- success/skipped runs are intentionally silent; the
          # status-alert workflow sends one ntfy once all 4 editions finish OK.
          if [ -f digest_failed.flag ]; then
            notify "DC Record Congress FAILED" "rotating_light" "$(cat digest_failed.flag)"
          elif [ "${{ job.status }}" == "failure" ]; then
            notify "DC Record Congress CRASHED" "rotating_light" "A step failed with no status flag written — check the Actions log."
          fi

      # Mirrors today's page to a fixed repo path (digest/congress.html) so the
      # markalfredsite /dc-record Pages Function can read it straight from
      # this repo's git history via GitHub's Contents API -- same mechanism
      # as the other three editions' digest/*.html files. No email is ever
      # sent for this edition; this commit is the only output.
      - name: Commit today's page
        run: |
          set -euo pipefail
          mkdir -p digest
          if compgen -G "newsletter-*.html" > /dev/null; then
            TODAY_TAG=$(TZ="America/Los_Angeles" date +%Y-%m-%d)
            AM_DATE_FILE="digest/.congress-am-date"
            PREV_AM_DATE=$(cat "$AM_DATE_FILE" 2>/dev/null || echo "")
            if [ "$PREV_AM_DATE" != "$TODAY_TAG" ]; then
              cp newsletter-*.html digest/congress-am.html
              echo "$TODAY_TAG" > "$AM_DATE_FILE"
              rm -f digest/congress-pm.html
            else
              cp newsletter-*.html digest/congress-pm.html
            fi
            cp newsletter-*.html digest/congress.html
          else
            echo "No page produced this run (likely a skipped/failed run) -- leaving digest/congress*.html as-is."
          fi
          git add digest/ archive/ data/vote-tally.json data/discharge-petitions.json data/congress-covered.json 2>/dev/null || git add digest/ archive/
          if ! git diff --cached --quiet; then
            git config user.name "dc-record-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "Update today's Congress page [skip ci]"
            # The other 3 DC Record workflows run on nearby cron slots and
            # can push to this same branch around the same time -- rebase-and-
            # retry on a non-fast-forward push instead of failing outright.
            bash scripts/push_with_retry.sh
          else
            echo "Page unchanged, nothing to commit."
          fi

      - name: Upload generated page as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-congress-${{ github.run_id }}
          path: newsletter-*.html
          if-no-files-found: ignore
          retention-days: 30
