name: DC Record • PM ready alert

# Fires one ntfy notification per day once all 4 editions' 3:45pm
# site-refresh-only run (see each edition's own workflow for that
# schedule's rationale) has landed on the site. Event-driven off each
# edition's own workflow completing (workflow_run) rather than a fixed
# clock time, so it's immune to GitHub's own scheduling drift (confirmed
# elsewhere in this repo to run hours late some days) -- whichever of the
# 4 completes last is what actually triggers the "all 4 ready" check.
#
# workflow_run fires on EVERY completion of these 4 workflows (both the
# 3am real edition and the 3:45pm site-refresh run, 8 times/day), so most
# invocations of this checker will correctly find "not all 4 yet" and
# exit quietly. A committed dedupe marker (digest/.pm-alert-date) prevents
# sending the same day's alert twice if more than one trigger observes
# "all 4 ready" in quick succession.

on:
  workflow_run:
    workflows:
      - "DC Record • Campaigns & Congress"
      - "DC Record • Lobbying"
      - "DC Record • Executive Branch"
      - "DC Record • Courts"
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write # needed to commit the dedupe marker

concurrency:
  group: dc-record-pm-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow depth=1 -- the git-log
          # date check below needs to walk back to whichever commit last
          # touched each digest/*-pm.html file, which a shallow clone
          # can't reliably do.
          fetch-depth: 0

      - name: Check whether all 4 PM editions landed today, alert once
        run: |
          set -euo pipefail
          TODAY=$(TZ="America/Los_Angeles" date +%Y-%m-%d)
          MISSING=""
          for pair in "campaigns:Campaigns & Congress" "lobbying:Lobbying" "executive:Executive Branch" "courts:Courts"; do
            id="${pair%%:*}"
            label="${pair##*:}"
            f="digest/${id}-pm.html"
            if [ ! -f "$f" ]; then
              MISSING="$MISSING, $label"
              continue
            fi
            LAST=$(TZ="America/Los_Angeles" git log -1 --format=%cd --date=format-local:%Y-%m-%d -- "$f")
            if [ "$LAST" != "$TODAY" ]; then
              MISSING="$MISSING, $label"
            fi
          done
          MISSING="${MISSING#, }"

          if [ -n "$MISSING" ]; then
            echo "Not all 4 PM editions are live yet today -- missing/stale: $MISSING"
            exit 0
          fi

          ALERTED_DATE=$(cat digest/.pm-alert-date 2>/dev/null || echo "")
          if [ "$ALERTED_DATE" == "$TODAY" ]; then
            echo "Already sent today's ($TODAY) all-4-ready alert -- staying quiet."
            exit 0
          fi

          curl -s --max-time 10 -H "Title: DC Record: all 4 PM editions live" -H "Tags: white_check_mark" \
            -d "Campaigns & Congress, Lobbying, Executive Branch, and Courts have all refreshed on markalfred.news/dc-record." \
            https://ntfy.sh/markalfreddotnews >/dev/null 2>&1 || true

          echo "$TODAY" > digest/.pm-alert-date
          git config user.name "dc-record-bot"
          git config user.email "actions@users.noreply.github.com"
          git add digest/.pm-alert-date
          git commit -m "Record today's all-4-PM-ready alert [skip ci]"
          # The 4 edition workflows can also be pushing to main around this
          # same time -- rebase-and-retry on a non-fast-forward push, same
          # pattern used by their own commit steps.
          PUSHED=false
          for i in 1 2 3 4 5; do
            if git push; then
              PUSHED=true
              break
            fi
            echo "Push rejected (attempt $i/5), rebasing onto latest and retrying..."
            git pull --rebase
            sleep $((RANDOM % 5 + 1))
          done
          $PUSHED
