name: DC Record • The Feds

on:
  # `schedule:` DISABLED 2026-09-12 -- GitHub's own schedule event was
  # observed firing this and the other editions ~3.5h late every single
  # day (best-effort, no SLA). Replaced by ../scheduler/, a Cloudflare
  # Worker with its own Cron Triggers that calls workflow_dispatch below at
  # the exact times these crons used to (0 10 * * * / 45 22 * * * UTC).
  # schedule:
  #   - cron: '0 10 * * *'    # AM, ~3:00am PT (PDT) -- dispatched with mode:"am"
  #   - cron: '45 22 * * *'   # PM, ~3:45pm PT (PDT) -- dispatched with mode:"pm"
  #                           # See ../scheduler/README.md.
  workflow_dispatch:
    inputs:
      mode:
        description: 'Which subscriber group to email: am or pm (see markalfred.news/dc-record-recipients).'
        required: false
        default: 'am'
      test_recipient_override:
        description: 'Send only to this address instead of the live subscriber list (leave blank for normal recipients)'
        required: false
        default: ''
      site_refresh_only:
        description: 'Site-refresh-only run (true/false) -- manual override that generates content but skips sending email and protects the dedupe manifests + digest/feds.html "latest" alias.'
        required: false
        default: 'false'
      force_resend:
        description: 'Send even if this date+mode already went out (true/false) -- bypasses the duplicate-send guard, see data/sent/.'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: dc-record-feds
  cancel-in-progress: false

jobs:
  # Duplicate-send guard (added 2026-10-05, after Cloudflare double-fired the
  # PM cron and every subscriber got two copies). The concurrency group above
  # already queues a second dispatch until the first finishes, so by the time
  # this runs, a real send for the same date+mode has committed its line to
  # data/sent/feds.txt on main. Only applies to real subscriber sends --
  # site_refresh_only/test_recipient_override runs and force_resend always proceed.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Check whether this date+mode was already sent
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ github.event.inputs.mode || 'am' }}
          REAL_SEND: ${{ github.event.inputs.site_refresh_only != 'true' && github.event.inputs.test_recipient_override == '' && github.event.inputs.force_resend != 'true' }}
        run: |
          TODAY=$(TZ=America/Los_Angeles date +%Y-%m-%d)
          SKIP=false
          if [ "$REAL_SEND" == "true" ] && gh api "repos/${{ github.repository }}/contents/data/sent/feds.txt?ref=main" \
              -H "Accept: application/vnd.github.raw" 2>/dev/null | grep -qx "$TODAY $MODE"; then
            SKIP=true
            echo "::notice::feds $MODE edition for $TODAY already sent -- skipping this duplicate dispatch (rerun with force_resend=true to override)."
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

  publish:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          # poppler/tesseract: PDF text + OCR of scanned pages; catdoc: legacy
          # .doc/.xls/.ppt -- every SAM.gov attachment is read (scripts/sam_reader.py)
          sudo apt-get install -y poppler-utils tesseract-ocr catdoc
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/claude" --version
          python3 --version

      - name: Compute today's date
        id: date
        run: echo "today=$(TZ=America/Los_Angeles date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Determine manual skip override
        id: email_decision
        run: |
          MANUAL_SKIP="false"
          if [ "${{ github.event.inputs.site_refresh_only }}" == "true" ]; then
            MANUAL_SKIP="true"
          fi
          echo "manual_skip=$MANUAL_SKIP" >> "$GITHUB_OUTPUT"

      - name: Run fetch/filter scripts
        env:
          FEC_KEYS: ${{ secrets.FEC_KEYS }}
          # fetch_usaspending.py is AM-only (USAspending loads once a day); PM writes a stub.
          MODE: ${{ github.event.inputs.mode || 'am' }}
          # Stop starting new SAM.gov attachments after 20 min; the rest are
          # read next edition (scripts/sam_docs.py).
          DC_SAM_DOCS_BUDGET_SEC: "1200"
          OMP_THREAD_LIMIT: "1"
        run: |
          set +e
          timeout 900 python3 scripts/fetch_omb.py; echo "fetch_omb exit=$?"
          timeout 900 python3 scripts/fetch_usaspending.py; echo "fetch_usaspending exit=$?"
          timeout 2400 python3 scripts/fetch_sam.py; echo "fetch_sam exit=$?"
          timeout 600 python3 scripts/fetch_lobby_contracts.py; echo "fetch_lobby_contracts exit=$?"
          timeout 600 python3 scripts/fetch_trade_dockets.py; echo "fetch_trade_dockets exit=$?"
          set -e

      - name: Check source reachability
        id: reachability
        run: |
          DOWN=$(python3 -c "
          import json
          files = ['omb_candidates.json','usaspending_candidates.json','sam_candidates.json']
          hosts = ['openomb.org/apportionment-public.max.gov','api.usaspending.gov','sam.gov']
          down = []
          for f, h in zip(files, hosts):
              try:
                  d = json.load(open(f'data/{f}'))
                  if d.get('reachable') is False:
                      down.append(h)
              except FileNotFoundError:
                  down.append(h + ' (fetch script did not run)')
          print(','.join(down))
          ")
          COUNT=$(echo -n "$DOWN" | tr ',' '\n' | grep -c . || true)
          echo "down_hosts=$DOWN" >> "$GITHUB_OUTPUT"
          echo "down_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Down hosts: $DOWN ($COUNT)"

      - name: Send network-issue notice and skip (2+ of 3 sources down)
        if: steps.reachability.outputs.down_count >= 2 && steps.email_decision.outputs.manual_skip != 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python3 scripts/send_notice.py "${{ steps.reachability.outputs.down_hosts }}"

      # Per-solicitation memory of attachment lines already screened on
      # earlier runs (scripts/screen_sam_docs.py LINE_MEMORY_PATH). Kept in
      # the Actions cache, not git: random hashes don't compress. A miss
      # only means no cross-run dedupe this run.
      - name: Restore SAM line memory
        if: steps.reachability.outputs.down_count < 2
        uses: actions/cache/restore@v4
        with:
          path: data/sam-line-memory.json
          key: sam-line-memory-${{ github.run_id }}
          restore-keys: sam-line-memory-

      - name: Screen SAM.gov solicitations (cheap model)
        if: steps.reachability.outputs.down_count < 2
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MODE: ${{ github.event.inputs.mode || 'am' }}
          # Cap Haiku attachment reading at 3M chars/run (was the 10M default,
          # ~$3.3/run); the rest stays in data/sam-docs-pending.json.
          DC_SAM_SCREEN_MAX_CHARS: "3000000"
        run: |
          # Haiku reads every attachment not read by an earlier run
          # (scripts/screen_sam_docs.py), all ~700 solicitation titles/
          # descriptions, and every new J&A document, deduping
          # against data/sam-seen.json for this AM/PM slot; on failure the
          # main pass falls back to data/sam_candidates.json on its own.
          python3 scripts/triage_sam.py || echo "triage_sam failed -- main pass will fall back"

      - name: Save SAM line memory
        if: always() && hashFiles('data/sam-line-memory.json') != ''
        uses: actions/cache/save@v4
        with:
          path: data/sam-line-memory.json
          key: sam-line-memory-${{ github.run_id }}

      - name: Screen USAspending awards (cheap model)
        if: steps.reachability.outputs.down_count < 2
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MODE: ${{ github.event.inputs.mode || 'am' }}
        run: |
          # AM only (both write a skipped stub in PM; assemble.py carries the
          # morning's section over). $2M+: new awards, +$25M modifications and
          # -$5M cuts, incl. the Defense Department's 90-day-delayed releases;
          # Haiku sorts what the main pass writes up from the routine rest
          # (listed mechanically in extras/feds/usaspending_routine.json).
          python3 scripts/triage_usaspending.py || echo "triage_usaspending failed -- main pass will fall back"
          # $100K-$2M: Haiku names the newsworthy ones, the main pass reads
          # only data/usaspending_small_triage.json.
          python3 scripts/triage_usaspending_small.py || echo "triage_usaspending_small failed -- section will say so"

      - name: Run mechanical content pass (OMB, cheap model)
        id: run_mechanical
        if: steps.reachability.outputs.down_count < 2
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set +e
          cat prompt-feds-mechanical.txt | \
            claude -p \
              --model claude-haiku-4-5-20251001 \
              --permission-mode bypassPermissions \
              --allowedTools "Read,Write" \
              --output-format json > claude_mechanical_result.json
          echo "mechanical exit=$?"
          set -e

          echo "::group::Claude usage/cost (mechanical pass)"
          if jq -e . claude_mechanical_result.json >/dev/null 2>&1; then
            jq -r '"cost_usd=" + (.total_cost_usd|tostring) + "  input_tokens=" + (.usage.input_tokens|tostring) + "  output_tokens=" + (.usage.output_tokens|tostring) + "  cache_read_input_tokens=" + (.usage.cache_read_input_tokens|tostring) + "  num_turns=" + (.num_turns|tostring)' claude_mechanical_result.json
          else
            echo "No valid JSON result -- main pass will use its fallback path. Raw output:"
            cat claude_mechanical_result.json
          fi
          echo "::endgroup::"

          echo "::group::Claude final message (mechanical pass)"
          jq -r '.result // empty' claude_mechanical_result.json 2>/dev/null || true
          echo "::endgroup::"
          exit 0

      - name: Run DC Record • The Feds (content generation)
        id: run_edition
        if: steps.reachability.outputs.down_count < 2
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MODE: ${{ github.event.inputs.mode || 'am' }}
        run: |
          TODAY="${{ steps.date.outputs.today }}"
          # One compact bundle from the triage files (scripts/build_feds_input.py),
          # one turn, no tools (scripts/run_pass.py) -- 2026-10-12. The OMB
          # section is inserted by assemble.py, not retyped by the model.
          python3 scripts/build_feds_input.py
          set +e
          echo "::group::Claude usage/cost (The Feds)"
          python3 scripts/run_pass.py prompt-feds.txt data/feds_input.txt \
            "content-$TODAY.json" data/feds_input.json
          CLAUDE_EXIT=$?
          echo "::endgroup::"
          set -e
          if jq -e . "content-$TODAY.json" >/dev/null 2>&1; then
            echo "content written" > content_written.flag
          else
            rm -f "content-$TODAY.json"
            echo "main pass exited $CLAUDE_EXIT without a valid content-$TODAY.json" > content_failed.flag
          fi
          exit $CLAUDE_EXIT

      - name: Assemble final content (append extras, Your Beat box, archive copy)
        if: steps.reachability.outputs.down_count < 2 && hashFiles(format('content-{0}.json', steps.date.outputs.today)) != ''
        env:
          MODE: ${{ github.event.inputs.mode || 'am' }}
        run: |
          python3 scripts/assemble.py feds "content-${{ steps.date.outputs.today }}.json"

      - name: Render newsletter from content JSON
        if: steps.reachability.outputs.down_count < 2 && hashFiles(format('content-{0}.json', steps.date.outputs.today)) != ''
        run: |
          python3 scripts/render_feds.py "content-${{ steps.date.outputs.today }}.json" "newsletter-${{ steps.date.outputs.today }}.html"

      - name: Suggest FOIA requests (private, for the /foia tracker)
        # One extra no-tools pass; posts drafts to markalfred.news/foia and never emails anyone.
        if: steps.reachability.outputs.down_count < 2 && hashFiles(format('content-{0}.json', steps.date.outputs.today)) != ''
        continue-on-error: true
        timeout-minutes: 10
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          FOIA_INGEST_TOKEN: ${{ secrets.FOIA_INGEST_TOKEN }}
        run: python3 scripts/suggest_foias.py feds "content-${{ steps.date.outputs.today }}.json"

      - name: Send email
        if: steps.reachability.outputs.down_count < 2 && hashFiles(format('newsletter-{0}.html', steps.date.outputs.today)) != ''
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DC_RECORD_RECIPIENTS_TOKEN: ${{ secrets.DC_RECORD_RECIPIENTS_TOKEN }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then MODE="am"; fi
          if [ "${{ steps.email_decision.outputs.manual_skip }}" == "true" ]; then
            echo "manual site_refresh_only input -- not sending" > email_skipped.flag
          elif [ -n "${{ github.event.inputs.test_recipient_override }}" ]; then
            python3 scripts/send_email.py \
              "newsletter-${{ steps.date.outputs.today }}.html" \
              "DC Record • The Feds • ${{ steps.date.outputs.today }}" \
              --to "${{ github.event.inputs.test_recipient_override }}"
          else
            EMAILS=$(curl -s -H "Authorization: Bearer $DC_RECORD_RECIPIENTS_TOKEN" \
              "https://markalfred.news/dc-record-recipients?edition=feds&mode=$MODE" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); sys.exit('recipients endpoint error: ' + json.dumps(d)[:300]) if 'emails' not in d else print(','.join(d['emails']))") \
              || { echo "recipients lookup failed (bad token or endpoint down)" > email_failed.flag; exit 1; }
            if [ -z "$EMAILS" ]; then
              echo "no subscribers for feds/$MODE -- not sending" > email_skipped.flag
            else
              python3 scripts/send_email.py \
                "newsletter-${{ steps.date.outputs.today }}.html" \
                "DC Record • The Feds • ${{ steps.date.outputs.today }}" \
                --to "$EMAILS"
            fi
          fi

      - name: Push ntfy notification of this run's outcome
        if: always()
        run: |
          notify() {
            curl -s --max-time 10 -H "Title: $1" -H "Tags: $2" -d "$3" \
              https://ntfy.sh/markalfreddotnews >/dev/null 2>&1 || true
          }
          # Failures only -- success/skipped runs are intentionally silent; the
          # status-alert workflow sends one ntfy once all 4 editions finish OK.
          if [ -f email_failed.flag ]; then
            notify "DC Record The Feds FAILED" "rotating_light" "$(cat email_failed.flag)"
          elif [ -f content_failed.flag ]; then
            notify "DC Record The Feds content FAILED" "rotating_light" "$(cat content_failed.flag)"
          elif [ "${{ job.status }}" == "failure" ]; then
            notify "DC Record The Feds CRASHED" "rotating_light" "A step failed with no status flag written — check the Actions log."
          fi

      # Also mirrors today's newsletter to a fixed repo path (digest/feds.html)
      # so the markalfredsite /dc-record Pages Function can read it straight
      # from this repo's git history via GitHub's Contents API.
      - name: Commit updated manifests and today's newsletter
        if: always()
        run: |
          set -euo pipefail
          IS_SITE_REFRESH="true"
          if [ -f email_sent.flag ]; then
            IS_SITE_REFRESH="false"
          fi
          # Record a real subscriber send so the guard job skips a duplicate dispatch of this slot.
          if [ "$IS_SITE_REFRESH" == "false" ] && [ -z "${{ github.event.inputs.test_recipient_override }}" ]; then
            mkdir -p data/sent
            echo "${{ steps.date.outputs.today }} ${{ github.event.inputs.mode || 'am' }}" >> data/sent/feds.txt
            git add data/sent/feds.txt
          fi
          mkdir -p digest
          if compgen -G "newsletter-*.html" > /dev/null; then
            # AM/PM comes from the dispatch `mode` input, not from run order: if the AM run failed,
            # the PM run must not be filed (and labeled) as AM.
            SLOT="${{ github.event.inputs.mode }}"
            if [ "$SLOT" == "pm" ]; then
              cp newsletter-*.html digest/feds-pm.html
            else
              cp newsletter-*.html digest/feds-am.html
              rm -f digest/feds-pm.html
            fi
            if [ "$IS_SITE_REFRESH" == "true" ]; then
              echo "Site-refresh-only (no-email) run -- leaving digest/feds.html on the real AM edition."
            else
              cp newsletter-*.html digest/feds.html
            fi
          else
            echo "No newsletter file produced this run (likely a skipped/failed run) -- leaving digest/feds*.html as-is."
          fi
          if [ "$IS_SITE_REFRESH" == "true" ]; then
            git checkout -- data/omb-spend-plan-manifest.json data/omb-apportionment-manifest.json data/usaspending-contracts-manifest.json data/usaspending-small-manifest.json data/lobby-contracts-seen.json data/lobby-contracts-pending.json data/trade-dockets-seen.json 2>/dev/null || true
            if [ "${{ steps.email_decision.outputs.manual_skip }}" == "true" ]; then
              # A manual test run: record nothing as shown.
              git checkout -- data/sam-seen.json data/surfaced-links.json 2>/dev/null || true
            else
              # Published to the website without email (the PM edition has no
              # subscribers): keep this mode's dedupe so the next edition of
              # the same mode doesn't repeat it (scripts/surfaced.py). Until
              # 2026-10-10 sam-seen.json was reverted whole and every PM
              # edition repeated 25-41 SAM.gov items.
              # No edition produced (main pass failed or timed out): nothing was
              # shown, so keep only the extraction cache -- on 2026-10-14 a
              # failed PM run marked 1,366 unpublished notices as seen.
              if compgen -G "newsletter-*.html" > /dev/null; then
                python3 scripts/keep_mode_keys.py data/sam-seen.json "${{ github.event.inputs.mode || 'am' }}" extracts
              else
                python3 scripts/keep_mode_keys.py data/sam-seen.json extracts
              fi
            fi
          fi
          # Some cache files only exist after certain code paths run; git add aborts on a missing pathspec
          for f in data/omb-spend-plan-manifest.json data/omb-apportionment-manifest.json data/usaspending-contracts-manifest.json data/usaspending-small-manifest.json data/sam-seen.json data/lobby-contracts-seen.json data/lobby-contracts-cache.json data/lobby-contracts-pending.json data/trade-dockets-seen.json data/sam-docs-read.json data/sam-docs-pending.json data/surfaced-links.json data/vendor-history-cache.json digest/ archive/; do
            [ -e "$f" ] && git add "$f"
          done
          if ! git diff --cached --quiet; then
            git config user.name "dc-record-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "Update manifests and today's newsletter [skip ci]"
            bash scripts/push_with_retry.sh
          else
            echo "Manifests and newsletter unchanged, nothing to commit."
          fi

      - name: Upload generated newsletter as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-feds-${{ github.run_id }}
          # The raw model reply too, when run_pass.py couldn't parse it.
          path: |
            newsletter-*.html
            content-*.raw.txt
          if-no-files-found: ignore
          retention-days: 30
