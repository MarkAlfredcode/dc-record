name: DC Record • Courts

on:
  schedule:
    # Once daily. All times UTC (GitHub Actions cron has no timezone
    # support). 10:25 UTC -- offset 25 minutes from the other three DC
    # Record workflows (all at :00 or :05) so this one's git push doesn't
    # collide with theirs on the same branch; will drift an hour once PST
    # (UTC-8) kicks in each November, same caveat as the others.
    - cron: '25 10 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dc-record-courts
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/claude" --version
          python3 --version

      - name: Compute today's date
        id: date
        run: echo "today=$(TZ=America/Los_Angeles date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # 2026-09-12 architecture change: Claude no longer writes the final
      # HTML itself -- it writes content-TODAY.json (see prompt-courts.txt's
      # OUTPUT FORMAT section) and scripts/render_courts.py below takes it
      # from there. This edition still does its own fetching via Bash
      # exactly as before; no email is sent for this edition either way.
      - name: Run DC Record • Courts (content generation)
        id: run_edition
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          COURTLISTENER_API_TOKEN: ${{ secrets.COURTLISTENER_API_TOKEN }}
        run: |
          set +e
          cat prompt-courts.txt | \
            claude -p \
              --permission-mode bypassPermissions \
              --allowedTools "Bash,Read,Write,Edit,Glob,Grep" \
              --output-format json > claude_result.json
          CLAUDE_EXIT=$?
          set -e

          echo "::group::Claude usage/cost (Courts)"
          if jq -e . claude_result.json >/dev/null 2>&1; then
            jq -r '"cost_usd=" + (.total_cost_usd|tostring) + "  input_tokens=" + (.usage.input_tokens|tostring) + "  output_tokens=" + (.usage.output_tokens|tostring) + "  cache_creation_input_tokens=" + (.usage.cache_creation_input_tokens|tostring) + "  cache_read_input_tokens=" + (.usage.cache_read_input_tokens|tostring) + "  duration_ms=" + (.duration_ms|tostring) + "  num_turns=" + (.num_turns|tostring)' claude_result.json
          else
            echo "No valid JSON result (likely errored before completion, e.g. a session-limit preflight failure). Raw output:"
            cat claude_result.json
          fi
          echo "::endgroup::"

          echo "::group::Claude final message (Courts)"
          jq -r '.result // empty' claude_result.json 2>/dev/null || true
          echo "::endgroup::"

          exit $CLAUDE_EXIT

      - name: Render page from content JSON
        if: hashFiles(format('content-{0}.json', steps.date.outputs.today)) != ''
        run: |
          python3 scripts/render_courts.py "content-${{ steps.date.outputs.today }}.json" "newsletter-${{ steps.date.outputs.today }}.html"

      - name: Push ntfy notification of this run's outcome
        if: always()
        run: |
          notify() {
            curl -s --max-time 10 -H "Title: $1" -H "Tags: $2" -d "$3" \
              https://ntfy.sh/markalfreddotnews >/dev/null 2>&1 || true
          }
          if [ -f digest_written.flag ]; then
            notify "DC Record Courts updated" "balance_scale" "$(cat digest_written.flag)"
          elif [ -f digest_failed.flag ]; then
            notify "DC Record Courts FAILED" "rotating_light" "$(cat digest_failed.flag)"
          elif [ -f digest_skipped.flag ]; then
            notify "DC Record Courts skipped" "warning" "$(cat digest_skipped.flag)"
          elif [ "${{ steps.run_edition.outcome }}" != "success" ]; then
            notify "DC Record Courts CRASHED" "rotating_light" "Run step failed with no status flag written — check the Actions log."
          else
            notify "DC Record Courts: unknown outcome" "warning" "Run finished but wrote no status flag — check the Actions log."
          fi

      # Mirrors today's page to a fixed repo path (digest/courts.html) so the
      # markalfredsite /dc-record Pages Function can read it straight from
      # this repo's git history via GitHub's Contents API -- same mechanism
      # as the other three editions' digest/*.html files. No email is ever
      # sent for this edition; this commit is the only output.
      - name: Commit updated litigation manifest and today's page
        run: |
          set -euo pipefail
          mkdir -p digest
          if compgen -G "newsletter-*.html" > /dev/null; then
            # AM/PM edition snapshots -- see dc-record-fec.yml's commit step
            # for the full rationale. digest/courts.html stays a "latest"
            # alias for backward compatibility.
            TODAY_TAG=$(TZ="America/Los_Angeles" date +%Y-%m-%d)
            AM_DATE_FILE="digest/.courts-am-date"
            PREV_AM_DATE=$(cat "$AM_DATE_FILE" 2>/dev/null || echo "")
            if [ "$PREV_AM_DATE" != "$TODAY_TAG" ]; then
              cp newsletter-*.html digest/courts-am.html
              echo "$TODAY_TAG" > "$AM_DATE_FILE"
              rm -f digest/courts-pm.html
            else
              cp newsletter-*.html digest/courts-pm.html
            fi
            cp newsletter-*.html digest/courts.html
          else
            echo "No page produced this run (likely a skipped/failed run) -- leaving digest/courts*.html as-is."
          fi
          if ! git diff --quiet -- data/courtlistener-cases-seen.json digest/; then
            git config user.name "dc-record-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/courtlistener-cases-seen.json digest/
            git commit -m "Update litigation manifest and today's Courts page [skip ci]"
            # The other three DC Record workflows run on nearby cron slots and
            # can push to this same branch around the same time -- rebase-and-
            # retry on a non-fast-forward push instead of failing outright
            # (confirmed happening live between the other editions 2026-09-05).
            PUSHED=false
            for i in 1 2 3 4 5; do
              if git push; then
                PUSHED=true
                break
              fi
              echo "Push rejected (attempt $i/5), rebasing onto latest and retrying..."
              git pull --rebase
              sleep $((RANDOM % 5 + 1))
            done
            $PUSHED
          else
            echo "Manifest and page unchanged, nothing to commit."
          fi

      - name: Upload generated page as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-courts-${{ github.run_id }}
          path: newsletter-*.html
          if-no-files-found: ignore
          retention-days: 30
