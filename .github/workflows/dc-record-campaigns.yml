name: DC Record • Campaigns

on:
  # `schedule:` DISABLED 2026-09-12 -- GitHub's own schedule event was
  # observed firing this and the other editions ~3.5h late every single
  # day (best-effort, no SLA). Replaced by ../scheduler/, a Cloudflare
  # Worker with its own Cron Triggers that calls workflow_dispatch below at
  # the exact times these crons used to (0 10 * * * / 45 22 * * * UTC).
  # Left here, commented, so the intended times/rationale aren't lost.
  # schedule:
  #   - cron: '0 10 * * *'    # AM, ~3:00am PT (PDT) -- dispatched with mode:"am"
  #   - cron: '45 22 * * *'   # PM, ~3:45pm PT (PDT) -- dispatched with mode:"pm"
  #                           # See ../scheduler/README.md.
  workflow_dispatch:
    inputs:
      mode:
        description: 'Which subscriber group to email: am or pm (see markalfred.news/dc-record-recipients).'
        required: false
        default: 'am'
      test_recipient_override:
        description: 'Send only to this address instead of the live subscriber list (leave blank for normal recipients)'
        required: false
        default: ''
      skip_email:
        description: 'Skip sending email entirely (true/false) -- manual override for snapshot-only test runs (e.g. producing an AM/PM edition to look at).'
        required: false
        default: 'false'
      verbose_diagnostics:
        description: 'Capture a full tool-by-tool trace (stream-json) as a build artifact, for cost/turn debugging (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write  # needed to commit the incumbent-candidates manifest (Task 1) and the fec-filings-seen/negative-amounts dedupe manifests

concurrency:
  group: dc-record-campaigns
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/claude" --version
          python3 --version

      - name: Compute today's date
        id: date
        run: echo "today=$(TZ=America/Los_Angeles date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Determine manual skip override
        id: email_decision
        run: |
          MANUAL_SKIP="false"
          if [ "${{ github.event.inputs.skip_email }}" == "true" ]; then
            MANUAL_SKIP="true"
          fi
          echo "manual_skip=$MANUAL_SKIP" >> "$GITHUB_OUTPUT"

      - name: Run negative-amounts and keyword-scan fetch scripts
        env:
          FEC_KEYS: ${{ secrets.FEC_KEYS }}
        run: |
          set +e
          python3 scripts/fetch_negative_amounts.py; echo "fetch_negative_amounts exit=$?"
          python3 scripts/fetch_keyword_scan.py; echo "fetch_keyword_scan exit=$?"
          set -e

      # Deterministic sections, built with no LLM (added 2026-10-03) -- see
      # scripts/dc_extras.py. assemble.py appends them after the main pass.
      - name: Run extras scripts (deadlines, Schedule B money-out sweep)
        env:
          FEC_KEYS: ${{ secrets.FEC_KEYS }}
          MODE: ${{ github.event.inputs.mode || 'am' }}
        run: |
          set +e
          for s in "fetch_deadlines.py --edition campaigns" fetch_money_out.py fetch_outside_money.py fetch_megadonors.py; do
            timeout 600 python3 scripts/$s; echo "$s exit=$?"
          done
          set -e

      - name: Run mechanical content pass (Voided & Negative Transactions + keyword-scan handoff, cheap model)
        id: run_mechanical
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set +e
          cat prompt-campaigns-mechanical.txt | \
            claude -p \
              --model claude-haiku-4-5-20251001 \
              --permission-mode bypassPermissions \
              --allowedTools "Read,Write" \
              --output-format json > claude_mechanical_result.json
          echo "mechanical exit=$?"
          set -e

          echo "::group::Claude usage/cost (mechanical pass)"
          if jq -e . claude_mechanical_result.json >/dev/null 2>&1; then
            jq -r '"cost_usd=" + (.total_cost_usd|tostring) + "  input_tokens=" + (.usage.input_tokens|tostring) + "  output_tokens=" + (.usage.output_tokens|tostring) + "  cache_read_input_tokens=" + (.usage.cache_read_input_tokens|tostring) + "  num_turns=" + (.num_turns|tostring)' claude_mechanical_result.json
          else
            echo "No valid JSON result -- main pass will use its fallback path. Raw output:"
            cat claude_mechanical_result.json
          fi
          echo "::endgroup::"

          echo "::group::Claude final message (mechanical pass)"
          jq -r '.result // empty' claude_mechanical_result.json 2>/dev/null || true
          echo "::endgroup::"
          exit 0

      - name: Run DC Record • Campaigns (content generation)
        id: run_edition
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          FEC_KEYS: ${{ secrets.FEC_KEYS }}
        run: |
          set +e
          if [ "${{ github.event.inputs.verbose_diagnostics }}" == "true" ]; then
            cat prompt-campaigns.txt | \
              claude -p \
                --permission-mode bypassPermissions \
                --allowedTools "Bash,Read,Write,Edit,Glob,Grep" \
                --output-format stream-json --verbose > claude_stream.jsonl
            CLAUDE_EXIT=$?
            tail -n1 claude_stream.jsonl > claude_result.json
          else
            cat prompt-campaigns.txt | \
              claude -p \
                --permission-mode bypassPermissions \
                --allowedTools "Bash,Read,Write,Edit,Glob,Grep" \
                --output-format json > claude_result.json
            CLAUDE_EXIT=$?
          fi
          set -e

          echo "::group::Claude usage/cost (Campaigns)"
          if jq -e . claude_result.json >/dev/null 2>&1; then
            jq -r '"cost_usd=" + (.total_cost_usd|tostring) + "  input_tokens=" + (.usage.input_tokens|tostring) + "  output_tokens=" + (.usage.output_tokens|tostring) + "  cache_creation_input_tokens=" + (.usage.cache_creation_input_tokens|tostring) + "  cache_read_input_tokens=" + (.usage.cache_read_input_tokens|tostring) + "  duration_ms=" + (.duration_ms|tostring) + "  num_turns=" + (.num_turns|tostring)' claude_result.json
          else
            echo "No valid JSON result (likely errored before completion, e.g. a session-limit preflight failure). Raw output:"
            cat claude_result.json
          fi
          echo "::endgroup::"

          echo "::group::Claude final message (Campaigns)"
          jq -r '.result // empty' claude_result.json 2>/dev/null || true
          echo "::endgroup::"

          exit $CLAUDE_EXIT

      - name: Upload verbose diagnostics trace
        if: always() && github.event.inputs.verbose_diagnostics == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: claude-stream-trace-${{ github.run_id }}
          path: claude_stream.jsonl
          if-no-files-found: ignore
          retention-days: 7

      - name: Assemble final content (append extras, Your Beat box, archive copy)
        if: hashFiles(format('content-{0}.json', steps.date.outputs.today)) != ''
        env:
          MODE: ${{ github.event.inputs.mode || 'am' }}
        run: |
          python3 scripts/assemble.py campaigns "content-${{ steps.date.outputs.today }}.json"

      - name: Render newsletter from content JSON
        if: hashFiles(format('content-{0}.json', steps.date.outputs.today)) != ''
        run: |
          python3 scripts/render_campaigns.py "content-${{ steps.date.outputs.today }}.json" "newsletter-${{ steps.date.outputs.today }}.html"

      - name: Send email
        if: hashFiles(format('newsletter-{0}.html', steps.date.outputs.today)) != ''
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DC_RECORD_RECIPIENTS_TOKEN: ${{ secrets.DC_RECORD_RECIPIENTS_TOKEN }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then MODE="am"; fi
          if [ "${{ steps.email_decision.outputs.manual_skip }}" == "true" ]; then
            echo "manual skip_email input -- not sending" > email_skipped.flag
          elif [ -n "${{ github.event.inputs.test_recipient_override }}" ]; then
            python3 scripts/send_email.py \
              "newsletter-${{ steps.date.outputs.today }}.html" \
              "DC Record • Campaigns • ${{ steps.date.outputs.today }}" \
              --from "DC Record • Campaigns <newsletter@markalfred.news>" \
              --to "${{ github.event.inputs.test_recipient_override }}"
          else
            EMAILS=$(curl -s -H "Authorization: Bearer $DC_RECORD_RECIPIENTS_TOKEN" \
              "https://markalfred.news/dc-record-recipients?edition=campaigns&mode=$MODE" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); sys.exit('recipients endpoint error: ' + json.dumps(d)[:300]) if 'emails' not in d else print(','.join(d['emails']))") \
              || { echo "recipients lookup failed (bad token or endpoint down)" > email_failed.flag; exit 1; }
            if [ -z "$EMAILS" ]; then
              echo "no subscribers for campaigns/$MODE -- not sending" > email_skipped.flag
            else
              python3 scripts/send_email.py \
                "newsletter-${{ steps.date.outputs.today }}.html" \
                "DC Record • Campaigns • ${{ steps.date.outputs.today }}" \
                --from "DC Record • Campaigns <newsletter@markalfred.news>" \
                --to "$EMAILS"
            fi
          fi

      - name: Push ntfy notification of this run's outcome
        if: always()
        run: |
          notify() {
            curl -s --max-time 10 -H "Title: $1" -H "Tags: $2" -d "$3" \
              https://ntfy.sh/markalfreddotnews >/dev/null 2>&1 || true
          }
          # Failures only -- success/skipped runs are intentionally silent; the
          # status-alert workflow sends one ntfy once all 4 editions finish OK.
          if [ -f email_failed.flag ]; then
            notify "DC Record Campaigns FAILED" "rotating_light" "$(cat email_failed.flag)"
          elif [ -f content_failed.flag ]; then
            notify "DC Record Campaigns content FAILED" "rotating_light" "$(cat content_failed.flag)"
          elif [ "${{ job.status }}" == "failure" ]; then
            notify "DC Record Campaigns CRASHED" "rotating_light" "A step failed with no status flag written — check the Actions log."
          fi

      # Also mirrors today's newsletter to a fixed repo path (digest/campaigns.html)
      # so the markalfredsite /dc-record Pages Function can read it straight from
      # this repo's git history via GitHub's Contents API.
      - name: Commit updated manifests and today's newsletter
        if: always()
        run: |
          set -euo pipefail
          IS_SITE_REFRESH="true"
          if [ -f email_sent.flag ]; then
            IS_SITE_REFRESH="false"
          fi
          mkdir -p digest
          if compgen -G "newsletter-*.html" > /dev/null; then
            # AM/PM comes from the dispatch `mode` input, not from run order: if the AM run failed,
            # the PM run must not be filed (and labeled) as AM.
            SLOT="${{ github.event.inputs.mode }}"
            if [ "$SLOT" == "pm" ]; then
              cp newsletter-*.html digest/campaigns-pm.html
            else
              cp newsletter-*.html digest/campaigns-am.html
              rm -f digest/campaigns-pm.html
            fi
            if [ "$IS_SITE_REFRESH" == "true" ]; then
              echo "Site-refresh-only (no-email) run -- leaving digest/campaigns.html on the real AM edition."
            else
              cp newsletter-*.html digest/campaigns.html
            fi
          else
            echo "No newsletter file produced this run (likely a skipped/failed run) -- leaving digest/campaigns*.html as-is."
          fi
          # A site-refresh-only run still lets Claude update the FEC-filings/
          # negative-amounts dedupe manifests on disk as part of its normal
          # task instructions -- revert those specific files before staging so
          # nothing gets marked "seen" without ever having been emailed;
          # tomorrow's real run will naturally re-find and correctly email
          # whatever this run scraped first. incumbent-candidates-manifest.json
          # isn't a "seen" dedupe file (just a candidate-status cache), so it's
          # fine to let it update normally either way.
          if [ "$IS_SITE_REFRESH" == "true" ]; then
            git checkout -- data/fec-filings-seen.json data/negative-amounts-seen.json data/money-out-seen.json data/election-seen.json data/outside-money-seen.json data/megadonors-seen.json 2>/dev/null || true
          fi
          git add data/incumbent-candidates-manifest.json data/fec-filings-seen.json data/negative-amounts-seen.json \
            data/money-out-seen.json data/election-seen.json data/outside-money-seen.json data/megadonors-seen.json data/former-members-committees.json data/member-committees.json digest/ archive/
          if ! git diff --cached --quiet; then
            git config user.name "dc-record-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "Update incumbent-candidates/FEC-filings/negative-amounts manifests and today's newsletter [skip ci]"
            # The Feds and Officials editions also push to main on nearby cron
            # slots -- rebase-and-retry on a non-fast-forward push instead of
            # failing outright.
            PUSHED=false
            for i in 1 2 3 4 5; do
              if git push; then
                PUSHED=true
                break
              fi
              echo "Push rejected (attempt $i/5), rebasing onto latest and retrying..."
              git pull --rebase
              sleep $((RANDOM % 5 + 1))
            done
            $PUSHED
          else
            echo "Manifest and newsletter unchanged, nothing to commit."
          fi

      - name: Upload generated newsletter as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-campaigns-${{ github.run_id }}
          path: newsletter-*.html
          if-no-files-found: ignore
          retention-days: 30
