name: The DC Record

on:
  schedule:
    # All times UTC (GitHub Actions cron has no timezone support). These are
    # tuned for PDT (UTC-7); they'll drift an hour once PST (UTC-8) kicks in
    # each November -- revisit then, same caveat as every fixed-UTC cron.
    # Each target is padded 30 min earlier than the actual desired delivery
    # time (8:30am/4:40pm/9:35pm Pacific) to absorb GitHub's scheduling
    # jitter -- see README "Known limitations" for why exact-time firing
    # isn't guaranteed.
    - cron: '0 15 * * *'   # ~8:00am Pacific  -> Morning edition (target delivery ~8:30am)
    - cron: '10 23 * * *'  # ~4:10pm Pacific  -> Afternoon edition (target delivery ~4:40pm)
    - cron: '5 4 * * *'    # ~9:05pm Pacific (previous Pacific day) -> Evening edition (target delivery ~9:35pm), session-gated
  workflow_dispatch:
    inputs:
      edition:
        description: 'Which edition to run (manual test)'
        required: true
        default: 'MORNING'
        type: choice
        options:
          - MORNING
          - AFTERNOON
          - EVENING

concurrency:
  group: dc-record-${{ github.event.schedule || inputs.edition }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Determine edition
        id: edition
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.edition }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              '0 15 * * *')  echo "mode=MORNING" >> "$GITHUB_OUTPUT" ;;
              '10 23 * * *') echo "mode=AFTERNOON" >> "$GITHUB_OUTPUT" ;;
              '5 4 * * *')   echo "mode=EVENING" >> "$GITHUB_OUTPUT" ;;
              *) echo "Unrecognized schedule '${{ github.event.schedule }}'"; exit 1 ;;
            esac
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          # Standalone installer (not npm -g): npm's global-install mode has
          # a known quirk where it fails to resolve the platform-specific
          # optionalDependency (the native binary) with no lockfile to pin
          # against -- confirmed live in this workflow. The standalone
          # installer downloads the correct native binary directly.
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/claude" --version

      - name: Run The DC Record
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FEC_KEYS: ${{ secrets.FEC_KEYS }}
        run: |
          { echo "EDITION_MODE=${{ steps.edition.outputs.mode }}"; cat prompt.txt; } | \
            claude -p \
              --permission-mode bypassPermissions \
              --allowedTools "Bash,Read,Write,Edit,Glob,Grep"

      - name: Upload generated newsletter as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-${{ steps.edition.outputs.mode }}-${{ github.run_id }}
          path: newsletter-*.html
          if-no-files-found: ignore
          retention-days: 30
