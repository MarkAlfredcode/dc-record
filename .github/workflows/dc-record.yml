name: The DC Record

# RETIRED 2026-09-04: split into three separate daily newsletters --
# dc-record-fec.yml, dc-record-lobbying.yml, dc-record-contracts.yml --
# each with its own prompt-*.txt. The `schedule` trigger below is disabled
# so this combined edition no longer sends automatically; workflow_dispatch
# is left in place as a manual fallback (e.g. to regenerate the old combined
# format for comparison) rather than deleting the file outright.
on:
  # schedule:
  #   All times UTC (GitHub Actions cron has no timezone support). These are
  #   tuned for PDT (UTC-7); they'll drift an hour once PST (UTC-8) kicks in
  #   each November -- revisit then, same caveat as every fixed-UTC cron.
  #   Each target is padded 90 min earlier than the actual desired delivery
  #   time (8:30am/4:40pm/9:35pm Pacific) -- widened from an initial 30 min
  #   on 2026-08-30 to absorb both GitHub's normal scheduling jitter and the
  #   watchdog's 45-min drop-detection grace period, so even a caught silent
  #   drop still lands close to the intended delivery time. See README
  #   "Known limitations" for why exact-time firing isn't guaranteed.
  #   - cron: '0 14 * * *'   # ~7:00am Pacific  -> Morning edition (target delivery ~8:30am)
  #   - cron: '10 22 * * *'  # ~3:10pm Pacific  -> Afternoon edition (target delivery ~4:40pm)
  #   - cron: '5 3 * * *'    # ~8:05pm Pacific (previous Pacific day) -> Evening edition (target delivery ~9:35pm), session-gated
  workflow_dispatch:
    inputs:
      edition:
        description: 'Which edition to run (manual test)'
        required: true
        default: 'MORNING'
        type: choice
        options:
          - MORNING
          - AFTERNOON
          - EVENING

permissions:
  contents: write  # needed to commit the OMB/USAspending manifests (Tasks 8-9, morning-only)
  actions: read  # needed by the duplicate-edition guard's runs/artifacts lookups

concurrency:
  # Keyed on the resolved EDITION name (not the raw trigger), so a scheduled
  # fire and a watchdog/manual dispatch for the same edition land in the same
  # group instead of silently coexisting. GitHub Actions expressions have no
  # real ternary, so this fakes one: each `cond && 'VALUE'` short-circuits to
  # the edition name when the schedule string matches, otherwise falls through
  # to inputs.edition for workflow_dispatch.
  group: dc-record-${{ (github.event.schedule == '0 14 * * *' && 'MORNING') || (github.event.schedule == '10 22 * * *' && 'AFTERNOON') || (github.event.schedule == '5 3 * * *' && 'EVENING') || inputs.edition }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Determine edition
        id: edition
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.edition }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              '0 14 * * *')  echo "mode=MORNING" >> "$GITHUB_OUTPUT" ;;
              '10 22 * * *') echo "mode=AFTERNOON" >> "$GITHUB_OUTPUT" ;;
              '5 3 * * *')   echo "mode=EVENING" >> "$GITHUB_OUTPUT" ;;
              *) echo "Unrecognized schedule '${{ github.event.schedule }}'"; exit 1 ;;
            esac
          fi

      # GitHub's schedule trigger has been landing 2-10+ hours late (see
      # dc-record-watchdog.yml's header), well past the watchdog's 45-min
      # drop-detection grace period. That means the watchdog now routinely
      # fires a catch-up dispatch for an edition whose original scheduled
      # run hasn't actually dropped -- just delayed -- and *both* eventually
      # run to completion. Unifying the concurrency group (above) only
      # serializes that pair; it doesn't stop the second one from still
      # sending a duplicate newsletter once it's done waiting. This step is
      # the actual dedupe: if another run has already published this same
      # EDITION since its window opened, skip the rest of the job.
      - name: Guard against duplicate edition for this window
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          EDITION="${{ steps.edition.outputs.mode }}"
          case "$EDITION" in
            MORNING)   HH=14; MM=0  ;;
            AFTERNOON) HH=22; MM=10 ;;
            EVENING)   HH=3;  MM=5  ;;
            *) echo "Unrecognized edition '$EDITION'"; exit 1 ;;
          esac

          NOW_EPOCH=$(date -u +%s)
          TODAY=$(date -u +%Y-%m-%d)
          WINDOW_EPOCH=$(date -u -d "${TODAY}T$(printf '%02d' "$HH"):$(printf '%02d' "$MM"):00Z" +%s)
          # Most recent past occurrence of this edition's cron time (handles
          # the EVENING cron landing after midnight UTC relative to its
          # Pacific evening, same as dc-record-watchdog.yml).
          if [ "$WINDOW_EPOCH" -gt "$NOW_EPOCH" ]; then
            WINDOW_EPOCH=$((WINDOW_EPOCH - 86400))
          fi
          SINCE_EPOCH=$((WINDOW_EPOCH - 300))
          SINCE=$(date -u -d "@${SINCE_EPOCH}" --iso-8601=seconds)

          RUN_IDS=$(gh api --method GET "repos/${{ github.repository }}/actions/workflows/dc-record.yml/runs" \
            -f status=success -f created=">=${SINCE}" -f per_page=20 \
            --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }}) | .id] | .[]")

          SHOULD_RUN=true
          for RUN_ID in $RUN_IDS; do
            NAME=$(gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}/artifacts" --jq '.artifacts[0].name // ""')
            if [[ "$NAME" == newsletter-${EDITION}-* ]]; then
              echo "Duplicate: run $RUN_ID already published $EDITION this window (artifact $NAME) -- skipping."
              SHOULD_RUN=false
              break
            fi
          done
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.guard.outputs.should_run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          # Standalone installer (not npm -g): npm's global-install mode has
          # a known quirk where it fails to resolve the platform-specific
          # optionalDependency (the native binary) with no lockfile to pin
          # against -- confirmed live in this workflow. The standalone
          # installer downloads the correct native binary directly.
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/claude" --version

      - name: Run The DC Record
        if: steps.guard.outputs.should_run == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FEC_KEYS: ${{ secrets.FEC_KEYS }}
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
        run: |
          { echo "EDITION_MODE=${{ steps.edition.outputs.mode }}"; cat prompt.txt; } | \
            claude -p \
              --permission-mode bypassPermissions \
              --allowedTools "Bash,Read,Write,Edit,Glob,Grep"

      # Only Tasks 8-9 (OMB Apportionments / USAspending Contracts, morning-only)
      # touch these files, so this is a no-op on AFTERNOON/EVENING runs.
      - name: Commit updated OMB/USAspending manifests
        if: steps.guard.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          if ! git diff --quiet -- data/omb-spend-plan-manifest.json data/usaspending-contracts-manifest.json; then
            git config user.name "dc-record-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/omb-spend-plan-manifest.json data/usaspending-contracts-manifest.json
            git commit -m "Update OMB/USAspending manifests [skip ci]"
            git push
          else
            echo "Manifests unchanged, nothing to commit."
          fi

      - name: Upload generated newsletter as a build artifact
        if: always() && steps.guard.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-${{ steps.edition.outputs.mode }}-${{ github.run_id }}
          path: newsletter-*.html
          if-no-files-found: ignore
          retention-days: 30
